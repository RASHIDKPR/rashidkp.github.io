<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rashid Photos</title>

<meta name="description" content="Personal media storage">
<meta name="theme-color" content="#0b0b0f">

<style>
:root{
    --bg:#0b0b0f;
    --bg2:#111116;
    --card:#17171d;
    --card2:#1e1e26;
    --text:#f5f5f7;
    --muted:#9b9ba5;
    --border:rgba(255,255,255,.09);
    --accent:#ffffff;
    --danger:#ff4d67;
    --shadow:0 20px 60px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at top left,rgba(255,255,255,.035),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:50;

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    background:rgba(11,11,15,.78);
    border-bottom:1px solid var(--border);
}

.header-inner{
    max-width:1500px;
    margin:auto;
    padding:18px 24px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-icon{
    width:42px;
    height:42px;

    border-radius:13px;

    display:grid;
    place-items:center;

    background:linear-gradient(
        135deg,
        #ffffff,
        #777
    );

    color:#111;
    font-size:20px;
}

.brand h1{
    font-size:18px;
    font-weight:700;
}

.brand p{
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
}

/* =========================
   BUTTONS
========================= */

button{
    border:0;
    cursor:pointer;
    font:inherit;
}

.btn{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);

    padding:11px 15px;
    border-radius:12px;

    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    transition:.2s ease;
}

.btn:hover{
    background:var(--card2);
    transform:translateY(-1px);
}

.btn.primary{
    background:#fff;
    color:#111;
    border-color:#fff;
    font-weight:600;
}

.btn.danger{
    color:#ff6a7e;
}

.btn.icon{
    width:44px;
    height:44px;
    padding:0;
}

.header-actions{
    display:flex;
    gap:8px;
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1500px;
    margin:auto;
    padding:28px 24px 70px;
}

/* =========================
   HERO
========================= */

.hero{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;

    margin-bottom:26px;
}

.hero h2{
    font-size:34px;
    letter-spacing:-1px;
}

.hero p{
    color:var(--muted);
    margin-top:7px;
}

.hero-actions{
    display:flex;
    gap:9px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:24px;
}

.stat{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    border:1px solid var(--border);
    border-radius:18px;

    padding:18px;

    box-shadow:var(--shadow);
}

.stat-label{
    color:var(--muted);
    font-size:13px;
}

.stat-value{
    font-size:25px;
    font-weight:700;
    margin-top:8px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:22px;
}

.search{
    flex:1;
    position:relative;
}

.search input{
    width:100%;
    height:46px;

    border:1px solid var(--border);
    border-radius:13px;

    background:var(--card);
    color:white;

    padding:0 16px 0 42px;
    outline:none;
}

.search input:focus{
    border-color:rgba(255,255,255,.25);
}

.search-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
}

.filters{
    display:flex;
    gap:7px;
}

.filter{
    padding:10px 14px;
    border-radius:11px;

    background:transparent;
    color:var(--muted);

    border:1px solid transparent;
}

.filter.active{
    background:var(--card);
    color:#fff;
    border-color:var(--border);
}

/* =========================
   DROP ZONE
========================= */

.dropzone{
    border:1px dashed rgba(255,255,255,.16);
    background:rgba(255,255,255,.018);

    border-radius:18px;

    padding:22px;
    text-align:center;

    margin-bottom:24px;

    transition:.2s;
}

.dropzone.dragging{
    background:rgba(255,255,255,.06);
    border-color:rgba(255,255,255,.4);
}

.dropzone p{
    color:var(--muted);
    font-size:14px;
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px,1fr)
        );

    gap:10px;
}

.media-card{
    position:relative;

    aspect-ratio:1/1;

    overflow:hidden;

    border-radius:14px;

    background:#15151a;

    border:1px solid var(--border);

    cursor:pointer;

    group:media;

    transition:
        transform .2s,
        box-shadow .2s;
}

.media-card:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.media-card img,
.media-card video{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:transform .35s;
}

.media-card:hover img,
.media-card:hover video{
    transform:scale(1.04);
}

.media-overlay{
    position:absolute;
    inset:auto 0 0 0;

    padding:35px 10px 10px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.85)
        );

    pointer-events:none;
}

.media-name{
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.media-date{
    color:#bbb;
    font-size:10px;
    margin-top:3px;
}

.video-badge{
    position:absolute;
    top:10px;
    left:10px;

    padding:5px 8px;

    border-radius:8px;

    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);

    font-size:11px;
}

/* =========================
   EMPTY
========================= */

.empty{
    padding:80px 20px;
    text-align:center;
    color:var(--muted);
}

.empty-icon{
    font-size:45px;
    margin-bottom:15px;
}

.empty h3{
    color:#fff;
    margin-bottom:7px;
}

/* =========================
   VIEWER
========================= */

.viewer{
    position:fixed;
    inset:0;

    z-index:100;

    background:
        rgba(0,0,0,.96);

    display:none;

    flex-direction:column;
}

.viewer.open{
    display:flex;
}

.viewer-top{
    height:70px;

    padding:12px 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        linear-gradient(
            rgba(0,0,0,.7),
            transparent
        );

    position:relative;
    z-index:5;
}

.viewer-info{
    min-width:0;
}

.viewer-title{
    font-size:14px;
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:45vw;
}

.viewer-counter{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.viewer-actions{
    display:flex;
    gap:7px;
}

.viewer-btn{
    width:42px;
    height:42px;

    border-radius:50%;

    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.08);

    color:white;

    display:grid;
    place-items:center;

    font-size:17px;

    transition:.2s;
}

.viewer-btn:hover{
    background:rgba(255,255,255,.18);
}

.viewer-content{
    flex:1;

    min-height:0;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:10px 80px;
}

.viewer-media{
    max-width:100%;
    max-height:calc(100vh - 160px);

    object-fit:contain;

    user-select:none;

    border-radius:4px;

    box-shadow:
        0 25px 100px rgba(0,0,0,.5);
}

.viewer-arrow{
    position:absolute;

    top:50%;
    transform:translateY(-50%);

    width:52px;
    height:52px;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.1);

    color:white;

    font-size:23px;

    display:grid;
    place-items:center;

    z-index:4;

    transition:.2s;
}

.viewer-arrow:hover{
    background:rgba(255,255,255,.18);
}

.viewer-prev{
    left:18px;
}

.viewer-next{
    right:18px;
}

.viewer-bottom{
    height:78px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:8px 15px;

    overflow-x:auto;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.8)
        );
}

.thumb-strip{
    display:flex;
    gap:7px;
}

.viewer-thumb{
    width:58px;
    height:58px;

    flex:none;

    border-radius:8px;

    overflow:hidden;

    opacity:.55;

    border:2px solid transparent;

    cursor:pointer;

    transition:.2s;
}

.viewer-thumb.active{
    opacity:1;
    border-color:white;
}

.viewer-thumb img,
.viewer-thumb video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   TOAST
========================= */

.toast-container{
    position:fixed;

    right:18px;
    bottom:18px;

    z-index:200;

    display:flex;
    flex-direction:column;
    gap:8px;
}

.toast{
    background:#1d1d23;
    border:1px solid var(--border);

    color:#fff;

    padding:13px 16px;

    border-radius:12px;

    box-shadow:var(--shadow);

    font-size:13px;

    animation:
        toastIn .25s ease;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* =========================
   LOADING
========================= */

.loading{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px,1fr)
        );

    gap:10px;
}

.skeleton{
    aspect-ratio:1;

    border-radius:14px;

    background:
        linear-gradient(
            90deg,
            #15151a,
            #202027,
            #15151a
        );

    background-size:200% 100%;

    animation:skeleton 1.3s infinite;
}

@keyframes skeleton{
    0%{
        background-position:200% 0;
    }

    100%{
        background-position:-200% 0;
    }
}

/* =========================
   UPLOAD PROGRESS
========================= */

.upload-panel{
    position:fixed;

    right:18px;
    bottom:18px;

    width:310px;

    z-index:150;

    display:none;

    background:#19191f;

    border:1px solid var(--border);

    border-radius:15px;

    padding:15px;

    box-shadow:var(--shadow);
}

.upload-panel.show{
    display:block;
}

.upload-title{
    display:flex;
    justify-content:space-between;

    font-size:13px;

    margin-bottom:10px;
}

.progress{
    height:6px;

    background:#2b2b32;

    border-radius:20px;

    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;

    background:#fff;

    transition:.2s;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .header-inner{
        padding:14px 15px;
    }

    .brand p{
        display:none;
    }

    .container{
        padding:20px 12px 50px;
    }

    .hero{
        align-items:flex-start;
        flex-direction:column;
    }

    .hero h2{
        font-size:28px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .stat:last-child{
        grid-column:span 2;
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .filters{
        overflow-x:auto;
    }

    .filter{
        white-space:nowrap;
    }

    .grid{
        grid-template-columns:
            repeat(
                3,
                minmax(0,1fr)
            );

        gap:5px;
    }

    .media-card{
        border-radius:9px;
    }

    .media-overlay{
        display:none;
    }

    .viewer-content{
        padding:10px 15px;
    }

    .viewer-media{
        max-height:calc(100vh - 145px);
    }

    .viewer-prev{
        left:8px;
    }

    .viewer-next{
        right:8px;
    }

    .viewer-arrow{
        width:42px;
        height:42px;
        opacity:.75;
    }

    .viewer-title{
        max-width:40vw;
    }

    .viewer-bottom{
        height:65px;
    }

    .viewer-thumb{
        width:48px;
        height:48px;
    }

    .upload-panel{
        left:12px;
        right:12px;
        width:auto;
    }
}

/* =========================
   NO SCROLL VIEWER
========================= */

body.viewer-open{
    overflow:hidden;
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <div class="brand">

            <div class="brand-icon">
                📸
            </div>

            <div>
                <h1>Rashid Photos</h1>
                <p>Personal media storage</p>
            </div>

        </div>

        <div class="header-actions">

            <button
                class="btn icon"
                onclick="loadMedia()"
                title="Refresh"
            >
                ↻
            </button>

            <button
                class="btn primary"
                onclick="document.getElementById('fileInput').click()"
            >
                ＋ Upload
            </button>

        </div>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

    <section class="hero">

        <div>

            <h2>Your Library</h2>

            <p>
                Store, browse and share your photos & videos.
            </p>

        </div>

        <div class="hero-actions">

            <button
                class="btn"
                onclick="copySiteLink()"
            >
                🔗 Share Library
            </button>

        </div>

    </section>


    <!-- STATS -->

    <section class="stats">

        <div class="stat">

            <div class="stat-label">
                Total files
            </div>

            <div
                class="stat-value"
                id="totalCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Photos
            </div>

            <div
                class="stat-value"
                id="photoCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Videos
            </div>

            <div
                class="stat-value"
                id="videoCount"
            >
                0
            </div>

        </div>

    </section>


    <!-- DROP -->

    <section
        class="dropzone"
        id="dropzone"
    >

        <p>
            Drag & drop photos or videos here
            or click Upload
        </p>

    </section>


    <!-- TOOLBAR -->

    <section class="toolbar">

        <div class="search">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="searchInput"
                type="search"
                placeholder="Search photos and videos..."
            >

        </div>


        <div class="filters">

            <button
                class="filter active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter"
                data-filter="image"
            >
                Photos
            </button>

            <button
                class="filter"
                data-filter="video"
            >
                Videos
            </button>

        </div>

    </section>


    <!-- MEDIA -->

    <div
        id="loading"
        class="loading"
    >

        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>

    </div>


    <div
        id="grid"
        class="grid"
        style="display:none"
    ></div>


    <div
        id="empty"
        class="empty"
        style="display:none"
    >

        <div class="empty-icon">
            🖼️
        </div>

        <h3>
            Nothing here yet
        </h3>

        <p>
            Upload your first photo or video.
        </p>

    </div>

</main>


<!-- =========================
     FILE INPUT
========================= -->

<input
    id="fileInput"
    type="file"
    multiple
    accept="image/*,video/*"
    hidden
>


<!-- =========================
     VIEWER
========================= -->

<div
    id="viewer"
    class="viewer"
>

    <div class="viewer-top">

        <div class="viewer-info">

            <div
                id="viewerTitle"
                class="viewer-title"
            >
                Photo
            </div>

            <div
                id="viewerCounter"
                class="viewer-counter"
            >
                1 / 1
            </div>

        </div>


        <div class="viewer-actions">

            <button
                class="viewer-btn"
                onclick="shareCurrent()"
                title="Share"
            >
                🔗
            </button>

            <button
                class="viewer-btn"
                onclick="copyCurrentLink()"
                title="Copy link"
            >
                📋
            </button>

            <button
                class="viewer-btn"
                onclick="downloadCurrent()"
                title="Download"
            >
                ↓
            </button>

            <button
                class="viewer-btn"
                onclick="fullscreenCurrent()"
                title="Fullscreen"
            >
                ⛶
            </button>

            <button
                class="viewer-btn"
                onclick="closeViewer()"
                title="Close"
            >
                ×
            </button>

        </div>

    </div>


    <div
        class="viewer-content"
        id="viewerContent"
    >

        <button
            class="viewer-arrow viewer-prev"
            onclick="previousMedia()"
            aria-label="Previous"
        >
            ‹
        </button>


        <div id="viewerMediaContainer"></div>


        <button
            class="viewer-arrow viewer-next"
            onclick="nextMedia()"
            aria-label="Next"
        >
            ›
        </button>

    </div>


    <div class="viewer-bottom">

        <div
            id="thumbStrip"
            class="thumb-strip"
        ></div>

    </div>

</div>


<!-- =========================
     UPLOAD PANEL
========================= -->

<div
    id="uploadPanel"
    class="upload-panel"
>

    <div class="upload-title">

        <span id="uploadText">
            Uploading...
        </span>

        <span id="uploadPercent">
            0%
        </span>

    </div>

    <div class="progress">

        <div
            id="progressBar"
            class="progress-bar"
        ></div>

    </div>

</div>


<!-- =========================
     TOAST
========================= -->

<div
    id="toastContainer"
    class="toast-container"
></div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API =
    "https://image-uploader.itsmerashidkp.workers.dev";


/*
    IMPORTANT:

    We don't hardcode your GitHub Pages URL.

    This means the sharing system automatically uses:

        https://your-site.com/?photo=...

    or

        https://username.github.io/repository/?photo=...

*/

const SITE_URL =
    window.location.origin +
    window.location.pathname;


/* =========================================================
   STATE
========================================================= */

let allMedia = [];

let filteredMedia = [];

let currentFilter = "all";

let currentIndex = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const grid =
    document.getElementById("grid");

const loading =
    document.getElementById("loading");

const empty =
    document.getElementById("empty");

const fileInput =
    document.getElementById("fileInput");

const searchInput =
    document.getElementById("searchInput");

const dropzone =
    document.getElementById("dropzone");

const viewer =
    document.getElementById("viewer");

const viewerMediaContainer =
    document.getElementById(
        "viewerMediaContainer"
    );


/* =========================================================
   INITIAL LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        setupEvents();

        await loadMedia();

        /*
            If URL contains:

            ?photo=images%2Fxxxx.jpg

            automatically open that photo.
        */

        openPhotoFromURL();

    }
);


/* =========================================================
   LOAD MEDIA
========================================================= */

async function loadMedia(){

    loading.style.display = "grid";

    grid.style.display = "none";

    empty.style.display = "none";

    try{

        const response =
            await fetch(
                `${API}/media`
            );

        if(!response.ok){

            throw new Error(
                "Failed to load media"
            );

        }

        const data =
            await response.json();

        allMedia =
            Array.isArray(data.files)
                ? data.files
                : [];

        /*
            Newest first
        */

        allMedia.sort(
            (a,b) =>
                new Date(b.createdAt) -
                new Date(a.createdAt)
        );

        updateStats();

        applyFilter();

    }
    catch(error){

        console.error(error);

        showToast(
            "Failed to load media"
        );

        loading.style.display =
            "none";

        empty.style.display =
            "block";

    }

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    const photos =
        allMedia.filter(
            item =>
                item.type &&
                item.type.startsWith("image/")
        );

    const videos =
        allMedia.filter(
            item =>
                item.type &&
                item.type.startsWith("video/")
        );

    document.getElementById(
        "totalCount"
    ).textContent =
        allMedia.length;

    document.getElementById(
        "photoCount"
    ).textContent =
        photos.length;

    document.getElementById(
        "videoCount"
    ).textContent =
        videos.length;

}


/* =========================================================
   FILTER
========================================================= */

function applyFilter(){

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    filteredMedia =
        allMedia.filter(
            item => {

                const matchesFilter =
                    currentFilter === "all" ||

                    (
                        currentFilter === "image" &&
                        item.type?.startsWith("image/")
                    ) ||

                    (
                        currentFilter === "video" &&
                        item.type?.startsWith("video/")
                    );


                const matchesSearch =
                    !search ||

                    item.name
                        ?.toLowerCase()
                        .includes(search);


                return (
                    matchesFilter &&
                    matchesSearch
                );

            }
        );


    renderGrid();

}


/* =========================================================
   RENDER GRID
========================================================= */

function renderGrid(){

    loading.style.display =
        "none";


    if(filteredMedia.length === 0){

        grid.style.display =
            "none";

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";

    grid.style.display =
        "grid";


    grid.innerHTML =
        filteredMedia
            .map(
                (item,index) =>
                    createCard(
                        item,
                        index
                    )
            )
            .join("");

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(
    item,
    index
){

    const isVideo =
        item.type?.startsWith("video/");


    const date =
        formatDate(
            item.createdAt
        );


    const mediaHTML =
        isVideo

            ? `
                <video
                    src="${escapeAttr(item.url)}"
                    muted
                    preload="metadata"
                ></video>
            `

            : `
                <img
                    src="${escapeAttr(item.url)}"
                    loading="lazy"
                    alt=""
                >
            `;


    return `

        <div
            class="media-card"
            onclick="openViewer(${index})"
        >

            ${mediaHTML}

            ${
                isVideo
                ? `
                    <div class="video-badge">
                        ▶ VIDEO
                    </div>
                  `
                : ""
            }

            <div class="media-overlay">

                <div class="media-name">
                    ${escapeHTML(item.name)}
                </div>

                <div class="media-date">
                    ${date}
                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   OPEN VIEWER
========================================================= */

function openViewer(index){

    if(
        index < 0 ||
        index >= filteredMedia.length
    ){

        return;

    }


    currentIndex =
        index;


    viewer.classList.add(
        "open"
    );

    document.body.classList.add(
        "viewer-open"
    );


    renderViewer();

}


/* =========================================================
   RENDER VIEWER
========================================================= */

function renderViewer(){

    const item =
        filteredMedia[currentIndex];


    if(!item){

        return;

    }


    document.getElementById(
        "viewerTitle"
    ).textContent =
        item.name;


    document.getElementById(
        "viewerCounter"
    ).textContent =
        `${currentIndex + 1} / ${filteredMedia.length}`;


    const isVideo =
        item.type?.startsWith("video/");


    if(isVideo){

        viewerMediaContainer.innerHTML = `

            <video
                id="activeViewerMedia"
                class="viewer-media"
                src="${escapeAttr(item.url)}"
                controls
                autoplay
                playsinline
            ></video>

        `;

    }
    else{

        viewerMediaContainer.innerHTML = `

            <img
                id="activeViewerMedia"
                class="viewer-media"
                src="${escapeAttr(item.url)}"
                draggable="false"
                alt=""
            >

        `;

    }


    renderThumbs();


    /*
        Update browser URL.

        This is what makes sharing an exact photo possible.
    */

    updatePhotoURL(
        item.key
    );

}


/* =========================================================
   THUMBNAILS
========================================================= */

function renderThumbs(){

    const strip =
        document.getElementById(
            "thumbStrip"
        );


    strip.innerHTML =
        filteredMedia
            .map(
                (item,index) => {

                    const isVideo =
                        item.type?.startsWith(
                            "video/"
                        );


                    return `

                        <div
                            class="
                                viewer-thumb
                                ${
                                    index === currentIndex
                                        ? "active"
                                        : ""
                                }
                            "
                            onclick="openViewer(${index})"
                        >

                            ${
                                isVideo

                                ? `
                                    <video
                                        src="${escapeAttr(item.url)}"
                                        muted
                                    ></video>
                                  `

                                : `
                                    <img
                                        src="${escapeAttr(item.url)}"
                                        loading="lazy"
                                        alt=""
                                    >
                                  `
                            }

                        </div>

                    `;

                }
            )
            .join("");


    /*
        Automatically scroll active thumbnail
        into view.
    */

    const active =
        strip.querySelector(
            ".active"
        );

    if(active){

        active.scrollIntoView({
            behavior:"smooth",
            block:"nearest",
            inline:"center"
        });

    }

}


/* =========================================================
   NEXT
========================================================= */

function nextMedia(){

    if(
        filteredMedia.length === 0
    ){

        return;

    }


    currentIndex =
        (
            currentIndex + 1
        ) %
        filteredMedia.length;


    renderViewer();

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousMedia(){

    if(
        filteredMedia.length === 0
    ){

        return;

    }


    currentIndex =
        (
            currentIndex - 1 +
            filteredMedia.length
        ) %
        filteredMedia.length;


    renderViewer();

}


/* =========================================================
   CLOSE VIEWER
========================================================= */

function closeViewer(){

    const video =
        document.getElementById(
            "activeViewerMedia"
        );

    if(video?.tagName === "VIDEO"){

        video.pause();

    }


    viewer.classList.remove(
        "open"
    );

    document.body.classList.remove(
        "viewer-open"
    );


    /*
        Remove ?photo from URL
    */

    const cleanURL =
        SITE_URL;

    window.history.replaceState(
        {},
        "",
        cleanURL
    );

}


/* =========================================================
   SHARE CURRENT PHOTO
========================================================= */

async function shareCurrent(){

    const item =
        filteredMedia[currentIndex];

    if(!item){

        return;

    }


    const shareURL =
        createShareURL(
            item.key
        );


    const shareData = {

        title:
            item.name ||
            "Photo",

        text:
            "Check out this photo",

        url:
            shareURL

    };


    /*
        Native mobile / desktop share
    */

    if(
        navigator.share
    ){

        try{

            await navigator.share(
                shareData
            );

            return;

        }
        catch(error){

            /*
                User cancelled share.
                Don't show error.
            */

            if(
                error.name ===
                "AbortError"
            ){

                return;

            }

        }

    }


    /*
        Fallback
    */

    await copyText(
        shareURL
    );

    showToast(
        "Photo link copied"
    );

}


/* =========================================================
   COPY CURRENT LINK
========================================================= */

async function copyCurrentLink(){

    const item =
        filteredMedia[currentIndex];

    if(!item){

        return;

    }


    const url =
        createShareURL(
            item.key
        );


    await copyText(
        url
    );


    showToast(
        "Photo link copied"
    );

}


/* =========================================================
   COPY LIBRARY LINK
========================================================= */

async function copySiteLink(){

    await copyText(
        SITE_URL
    );

    showToast(
        "Library link copied"
    );

}


/* =========================================================
   CREATE SHARE URL
========================================================= */

function createShareURL(
    key
){

    return (
        SITE_URL +
        "?photo=" +
        encodeURIComponent(key)
    );

}


/* =========================================================
   UPDATE PHOTO URL
========================================================= */

function updatePhotoURL(
    key
){

    const url =
        createShareURL(
            key
        );


    window.history.replaceState(
        {},
        "",
        url
    );

}


/* =========================================================
   OPEN PHOTO FROM URL
========================================================= */

function openPhotoFromURL(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const key =
        params.get(
            "photo"
        );


    if(!key){

        return;

    }


    /*
        Find exact file.
    */

    const index =
        filteredMedia.findIndex(
            item =>
                item.key === key
        );


    if(index === -1){

        /*
            It might be filtered by
            Photos/Videos/Search.

            Reset everything.
        */

        currentFilter =
            "all";

        searchInput.value =
            "";

        document
            .querySelectorAll(
                ".filter"
            )
            .forEach(
                button =>
                    button.classList.remove(
                        "active"
                    )
            );

        document
            .querySelector(
                '[data-filter="all"]'
            )
            .classList.add(
                "active"
            );


        applyFilter();


        const retryIndex =
            filteredMedia.findIndex(
                item =>
                    item.key === key
            );


        if(retryIndex !== -1){

            openViewer(
                retryIndex
            );

        }

        return;

    }


    openViewer(
        index
    );

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadCurrent(){

    const item =
        filteredMedia[currentIndex];

    if(!item){

        return;

    }


    const url =
        item.url +
        "?download=" +
        encodeURIComponent(
            item.name || "download"
        );


    const link =
        document.createElement(
            "a"
        );

    link.href =
        url;

    link.target =
        "_blank";

    link.rel =
        "noopener";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function fullscreenCurrent(){

    const media =
        document.getElementById(
            "activeViewerMedia"
        );


    if(!media){

        return;

    }


    try{

        if(
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }
        else{

            await media.requestFullscreen();

        }

    }
    catch(error){

        console.error(
            error
        );

    }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteCurrent(){

    const item =
        filteredMedia[currentIndex];

    if(!item){

        return;

    }


    const confirmed =
        confirm(
            `Delete "${item.name}"?`
        );


    if(!confirmed){

        return;

    }


    try{

        const encodedKey =
            encodeURIComponent(
                item.key
            );


        const response =
            await fetch(
                `${API}/media/${encodedKey}`,
                {
                    method:"DELETE"
                }
            );


        if(!response.ok){

            throw new Error(
                "Delete failed"
            );

        }


        showToast(
            "Deleted"
        );


        closeViewer();

        await loadMedia();

    }
    catch(error){

        console.error(
            error
        );

        showToast(
            "Delete failed"
        );

    }

}


/* =========================================================
   UPLOAD
========================================================= */

fileInput.addEventListener(
    "change",
    event => {

        const files =
            Array.from(
                event.target.files
            );


        if(files.length){

            uploadFiles(
                files
            );

        }


        fileInput.value =
            "";

    }
);


/* =========================================================
   UPLOAD FILES
========================================================= */

async function uploadFiles(
    files
){

    for(
        const file of files
    ){

        await uploadFile(
            file
        );

    }


    await loadMedia();

}


/* =========================================================
   SINGLE UPLOAD
========================================================= */

function uploadFile(
    file
){

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            const xhr =
                new XMLHttpRequest();


            xhr.open(
                "POST",
                `${API}/upload`
            );


            const panel =
                document.getElementById(
                    "uploadPanel"
                );


            const bar =
                document.getElementById(
                    "progressBar"
                );


            const text =
                document.getElementById(
                    "uploadText"
                );


            const percent =
                document.getElementById(
                    "uploadPercent"
                );


            panel.classList.add(
                "show"
            );


            text.textContent =
                `Uploading ${file.name}`;


            xhr.upload.onprogress =
                event => {

                    if(
                        !event.lengthComputable
                    ){

                        return;

                    }


                    const value =
                        Math.round(
                            (
                                event.loaded /
                                event.total
                            ) * 100
                        );


                    bar.style.width =
                        `${value}%`;


                    percent.textContent =
                        `${value}%`;

                };


            xhr.onload =
                () => {

                    if(
                        xhr.status >= 200 &&
                        xhr.status < 300
                    ){

                        showToast(
                            `${file.name} uploaded`
                        );

                        resolve();

                    }
                    else{

                        showToast(
                            `Upload failed: ${file.name}`
                        );

                        reject(
                            new Error(
                                xhr.responseText
                            )
                        );

                    }


                    setTimeout(
                        () => {

                            panel.classList.remove(
                                "show"
                            );

                            bar.style.width =
                                "0%";

                        },
                        700
                    );

                };


            xhr.onerror =
                () => {

                    showToast(
                        `Upload failed: ${file.name}`
                    );

                    panel.classList.remove(
                        "show"
                    );

                    reject(
                        new Error(
                            "Network error"
                        )
                    );

                };


            xhr.send(
                formData
            );

        }
    );

}


/* =========================================================
   EVENTS
========================================================= */

function setupEvents(){

    /*
        Search
    */

    searchInput.addEventListener(
        "input",
        applyFilter
    );


    /*
        Filters
    */

    document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".filter"
                            )
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "active"
                                    )
                            );


                        button.classList.add(
                            "active"
                        );


                        currentFilter =
                            button.dataset.filter;


                        applyFilter();

                    }
                );

            }
        );


    /*
        Drag & Drop
    */

    [
        "dragenter",
        "dragover"
    ].forEach(
        eventName => {

            dropzone.addEventListener(
                eventName,
                event => {

                    event.preventDefault();

                    dropzone.classList.add(
                        "dragging"
                    );

                }
            );

        }
    );


    [
        "dragleave",
        "drop"
    ].forEach(
        eventName => {

            dropzone.addEventListener(
                eventName,
                event => {

                    event.preventDefault();

                    dropzone.classList.remove(
                        "dragging"
                    );

                }
            );

        }
    );


    dropzone.addEventListener(
        "drop",
        event => {

            const files =
                Array.from(
                    event.dataTransfer.files
                );


            if(files.length){

                uploadFiles(
                    files
                );

            }

        }
    );


    dropzone.addEventListener(
        "click",
        () => {

            fileInput.click();

        }
    );


    /*
        Keyboard navigation
    */

    document.addEventListener(
        "keydown",
        event => {

            if(
                !viewer.classList.contains(
                    "open"
                )
            ){

                return;

            }


            if(
                event.key ===
                "ArrowRight"
            ){

                nextMedia();

            }


            if(
                event.key ===
                "ArrowLeft"
            ){

                previousMedia();

            }


            if(
                event.key ===
                "Escape"
            ){

                closeViewer();

            }


            if(
                event.key ===
                " "
            ){

                event.preventDefault();

                toggleVideo();

            }

        }
    );


    setupSwipe();

}


/* =========================================================
   SWIPE
========================================================= */

function setupSwipe(){

    let startX = 0;

    let startY = 0;

    let startTime = 0;


    const area =
        document.getElementById(
            "viewerContent"
        );


    area.addEventListener(
        "touchstart",
        event => {

            const touch =
                event.changedTouches[0];


            startX =
                touch.clientX;

            startY =
                touch.clientY;

            startTime =
                Date.now();

        },
        {
            passive:true
        }
    );


    area.addEventListener(
        "touchend",
        event => {

            const touch =
                event.changedTouches[0];


            const endX =
                touch.clientX;

            const endY =
                touch.clientY;


            const diffX =
                endX - startX;

            const diffY =
                endY - startY;


            const elapsed =
                Date.now() -
                startTime;


            /*
                Horizontal swipe only
            */

            if(
                Math.abs(diffX) > 60 &&
                Math.abs(diffX) > Math.abs(diffY) * 1.3 &&
                elapsed < 800
            ){

                if(diffX < 0){

                    nextMedia();

                }
                else{

                    previousMedia();

                }

            }

        },
        {
            passive:true
        }
    );

}


/* =========================================================
   VIDEO PLAY / PAUSE
========================================================= */

function toggleVideo(){

    const video =
        document.getElementById(
            "activeViewerMedia"
        );


    if(
        !video ||
        video.tagName !== "VIDEO"
    ){

        return;

    }


    if(video.paused){

        video.play();

    }
    else{

        video.pause();

    }

}


/* =========================================================
   COPY
========================================================= */

async function copyText(
    text
){

    try{

        await navigator.clipboard.writeText(
            text
        );

    }
    catch(error){

        /*
            Fallback for older browsers
        */

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.select();

        document.execCommand(
            "copy"
        );


        textarea.remove();

    }

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message
){

    const container =
        document.getElementById(
            "toastContainer"
        );


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        "toast";


    toast.textContent =
        message;


    container.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.remove();

        },
        2500
    );

}


/* =========================================================
   DATE
========================================================= */

function formatDate(
    value
){

    if(!value){

        return "";

    }


    const date =
        new Date(value);


    return date.toLocaleString(
        undefined,
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttr(
    value
){

    return escapeHTML(
        value
    );

}


/* =========================================================
   CLOSE WHEN CLICKING BACKDROP
========================================================= */

viewer.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            viewer
        ){

            closeViewer();

        }

    }
);

</script>

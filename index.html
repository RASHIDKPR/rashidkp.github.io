<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI Image Editor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 10% 10%,
          #243b55,
          transparent 40%
        ),
        radial-gradient(
          circle at 90% 90%,
          #141e30,
          #05070b
        );

      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    /* HEADER */

    h1 {
      text-align: center;
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    /* CARD */

    .card {
      background: rgba(255, 255, 255, 0.07);

      border: 1px solid rgba(255, 255, 255, 0.12);

      border-radius: 22px;

      padding: 25px;

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* UPLOAD */

    .upload-box {
      display: block;

      border: 2px dashed #555;

      border-radius: 18px;

      padding: 35px 20px;

      text-align: center;

      cursor: pointer;

      transition: 0.2s;
    }

    .upload-box:hover {
      border-color: #8b5cf6;

      background: rgba(
        139,
        92,
        246,
        0.08
      );
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .upload-text {
      color: #aaa;

      margin-top: 8px;

      font-size: 14px;
    }

    #imageInput {
      display: none;
    }

    /* SOURCE PREVIEW */

    .preview-container {
      display: none;

      margin-top: 20px;

      text-align: center;
    }

    .preview-container img {
      display: block;

      width: 100%;

      max-height: 450px;

      border-radius: 15px;

      object-fit: contain;

      background: #111;
    }

    .file-name {
      color: #aaa;

      font-size: 13px;

      margin-top: 10px;
    }

    /* PROMPT */

    textarea {
      width: 100%;

      min-height: 130px;

      resize: vertical;

      margin-top: 25px;

      padding: 18px;

      border-radius: 15px;

      border: 1px solid #444;

      background: rgba(0, 0, 0, 0.35);

      color: white;

      font-size: 16px;

      line-height: 1.5;

      outline: none;
    }

    textarea:focus {
      border-color: #8b5cf6;
    }

    textarea::placeholder {
      color: #777;
    }

    /* BUTTON */

    .generate-btn {
      width: 100%;

      margin-top: 18px;

      padding: 16px;

      border: none;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #4f46e5
        );

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    .generate-btn:hover {
      transform: translateY(-1px);

      opacity: 0.9;
    }

    .generate-btn:disabled {
      opacity: 0.5;

      cursor: not-allowed;

      transform: none;
    }

    /* LOADING */

    .loading {
      display: none;

      text-align: center;

      margin-top: 25px;
    }

    .spinner {
      width: 40px;

      height: 40px;

      border: 4px solid #444;

      border-top-color: #8b5cf6;

      border-radius: 50%;

      animation: spin 1s linear infinite;

      margin: auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ERROR */

    .error {
      display: none;

      margin-top: 20px;

      padding: 14px;

      border-radius: 12px;

      background: rgba(
        255,
        0,
        0,
        0.15
      );

      border: 1px solid rgba(
        255,
        0,
        0,
        0.3
      );

      color: #ff8a8a;

      line-height: 1.5;
    }

    /* RESULT */

    .result {
      display: none;

      margin-top: 30px;
    }

    .result h2 {
      margin-bottom: 15px;
    }

    .result img {
      display: block;

      width: 100%;

      max-height: 700px;

      object-fit: contain;

      border-radius: 18px;

      cursor: pointer;

      background: #111;
    }

    /* DOWNLOAD */

    .download-btn {
      display: block;

      text-align: center;

      text-decoration: none;

      margin-top: 15px;

      padding: 14px;

      border-radius: 13px;

      background: #16a34a;

      color: white;

      font-weight: bold;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    /* HINT */

    .hint {
      margin-top: 15px;

      color: #777;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;
    }

    /* MODAL */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      background: rgba(
        0,
        0,
        0,
        0.92
      );

      z-index: 9999;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }

    .modal img {
      max-width: 95%;

      max-height: 95%;

      object-fit: contain;
    }

    .close {
      position: absolute;

      top: 15px;

      right: 25px;

      font-size: 45px;

      cursor: pointer;

      color: white;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      body {
        padding: 15px 10px;
      }

      h1 {
        font-size: 28px;
      }

      .card {
        padding: 18px;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <h1>✨ AI Image Editor</h1>

    <p class="subtitle">
      Upload an image and tell AI what you want to change.
    </p>


    <div class="card">

      <!-- ========================= -->
      <!-- IMAGE UPLOAD -->
      <!-- ========================= -->

      <label
        class="upload-box"
        for="imageInput"
      >

        <div class="upload-icon">
          📷
        </div>

        <div>
          Click to upload an image
        </div>

        <div class="upload-text">
          JPG, PNG or WEBP
        </div>

      </label>


      <input
        type="file"
        id="imageInput"
        accept="image/png,image/jpeg,image/webp"
      />


      <!-- ========================= -->
      <!-- SOURCE IMAGE PREVIEW -->
      <!-- ========================= -->

      <div
        class="preview-container"
        id="previewContainer"
      >

        <img
          id="sourcePreview"
          alt="Selected image"
        />

        <div
          class="file-name"
          id="fileName"
        ></div>

      </div>


      <!-- ========================= -->
      <!-- PROMPT -->
      <!-- ========================= -->

      <textarea
        id="prompt"
        placeholder="Tell AI what you want to change...

Example:
Change the shirt to a black suit. Keep the person's face, identity, pose and background unchanged."
      ></textarea>


      <!-- ========================= -->
      <!-- GENERATE -->
      <!-- ========================= -->

      <button
        class="generate-btn"
        id="generateBtn"
      >
        ✨ Generate / Edit Image
      </button>


      <!-- ========================= -->
      <!-- LOADING -->
      <!-- ========================= -->

      <div
        class="loading"
        id="loading"
      >

        <div class="spinner"></div>

        <p
          style="
            margin-top:12px;
            color:#aaa;
          "
        >
          AI is editing your image...
        </p>

      </div>


      <!-- ========================= -->
      <!-- ERROR -->
      <!-- ========================= -->

      <div
        class="error"
        id="error"
      ></div>


      <!-- ========================= -->
      <!-- RESULT -->
      <!-- ========================= -->

      <div
        class="result"
        id="result"
      >

        <h2>
          ✨ Result
        </h2>

        <img
          id="resultImage"
          alt="AI generated image"
        />


        <a
          id="downloadBtn"
          class="download-btn"
          download="ai-edited-image.png"
        >
          ⬇️ Download Image
        </a>


        <p class="hint">
          Click the generated image to view it fullscreen.
        </p>

      </div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- FULLSCREEN MODAL -->
  <!-- ========================= -->

  <div
    class="modal"
    id="modal"
  >

    <div
      class="close"
      id="closeModal"
    >
      ×
    </div>

    <img
      id="modalImage"
      alt="Fullscreen result"
    />

  </div>


  <script>

    // =====================================================
    // CLOUDFLARE WORKER
    // =====================================================

    const API_URL =
      "https://image-api.itsmerashidkp.workers.dev";


    // =====================================================
    // ELEMENTS
    // =====================================================

    const imageInput =
      document.getElementById(
        "imageInput"
      );

    const sourcePreview =
      document.getElementById(
        "sourcePreview"
      );

    const previewContainer =
      document.getElementById(
        "previewContainer"
      );

    const fileName =
      document.getElementById(
        "fileName"
      );

    const promptInput =
      document.getElementById(
        "prompt"
      );

    const generateBtn =
      document.getElementById(
        "generateBtn"
      );

    const loading =
      document.getElementById(
        "loading"
      );

    const errorBox =
      document.getElementById(
        "error"
      );

    const result =
      document.getElementById(
        "result"
      );

    const resultImage =
      document.getElementById(
        "resultImage"
      );

    const downloadBtn =
      document.getElementById(
        "downloadBtn"
      );

    const modal =
      document.getElementById(
        "modal"
      );

    const modalImage =
      document.getElementById(
        "modalImage"
      );

    const closeModal =
      document.getElementById(
        "closeModal"
      );


    // =====================================================
    // SELECTED FILE
    // =====================================================

    let selectedFile = null;

    let resultURL = null;


    // =====================================================
    // IMAGE SELECT
    // =====================================================

    imageInput.addEventListener(
      "change",
      () => {

        const file =
          imageInput.files[0];

        if (!file) {
          return;
        }


        // Check actual file type
        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          selectedFile = null;

          showError(
            "Please select a valid image file."
          );

          return;
        }


        selectedFile = file;


        fileName.textContent =
          file.name;


        // Use FileReader instead of
        // object URL for reliable preview

        const reader =
          new FileReader();


        reader.onload = () => {

          sourcePreview.src =
            reader.result;

          previewContainer.style.display =
            "block";

        };


        reader.onerror = () => {

          selectedFile = null;

          showError(
            "Could not load the selected image."
          );

        };


        reader.readAsDataURL(
          file
        );

      }
    );


    // =====================================================
    // RESIZE IMAGE
    // =====================================================

    function resizeImage(file) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();


          reader.onload = () => {

            const img =
              new Image();


            img.onload = () => {

              /*
                Cloudflare FLUX.2 Klein 4B
                reference image:
                keep it below 512 x 512
              */

              const maxSize = 511;


              let width =
                img.naturalWidth;

              let height =
                img.naturalHeight;


              if (
                !width ||
                !height
              ) {

                reject(
                  new Error(
                    "Could not read image dimensions."
                  )
                );

                return;
              }


              // Keep original aspect ratio

              if (
                width > maxSize ||
                height > maxSize
              ) {

                const scale =
                  Math.min(
                    maxSize / width,
                    maxSize / height
                  );


                width =
                  Math.max(
                    1,
                    Math.round(
                      width * scale
                    )
                  );


                height =
                  Math.max(
                    1,
                    Math.round(
                      height * scale
                    )
                  );

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              if (!ctx) {

                reject(
                  new Error(
                    "Could not create image canvas."
                  )
                );

                return;
              }


              // Draw image

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              // Convert to JPEG

              canvas.toBlob(
                (blob) => {

                  if (!blob) {

                    reject(
                      new Error(
                        "Could not convert image."
                      )
                    );

                    return;
                  }


                  resolve(blob);

                },
                "image/jpeg",
                0.90
              );

            };


            img.onerror = () => {

              reject(
                new Error(
                  "Invalid image."
                )
              );

            };


            img.src =
              reader.result;

          };


          reader.onerror = () => {

            reject(
              new Error(
                "Could not read image file."
              )
            );

          };


          reader.readAsDataURL(
            file
          );

        }
      );

    }


    // =====================================================
    // GENERATE / EDIT
    // =====================================================

    generateBtn.addEventListener(
      "click",
      async () => {

        hideError();

        result.style.display =
          "none";


        // Check image

        if (!selectedFile) {

          showError(
            "Please select an image first."
          );

          return;
        }


        // Check prompt

        const prompt =
          promptInput.value.trim();


        if (!prompt) {

          showError(
            "Please enter a prompt."
          );

          return;
        }


        // UI loading

        generateBtn.disabled =
          true;

        loading.style.display =
          "block";


        try {

          // -----------------------------------------------
          // Resize image
          // -----------------------------------------------

          const resizedImage =
            await resizeImage(
              selectedFile
            );


          console.log(
            "Original image:",
            selectedFile.size,
            "bytes"
          );


          console.log(
            "Resized image:",
            resizedImage.size,
            "bytes"
          );


          // -----------------------------------------------
          // Create multipart request
          // -----------------------------------------------

          const formData =
            new FormData();


          formData.append(
            "prompt",
            prompt
          );


          formData.append(
            "image",
            resizedImage,
            "input.jpg"
          );


          // -----------------------------------------------
          // Send to Worker
          // -----------------------------------------------

          console.log(
            "Sending image to Cloudflare..."
          );


          const response =
            await fetch(
              API_URL,
              {
                method: "POST",
                body: formData
              }
            );


          // -----------------------------------------------
          // Error response
          // -----------------------------------------------

          if (!response.ok) {

            let message =
              "Image generation failed.";


            try {

              const data =
                await response.json();


              if (data.error) {
                message =
                  data.error;
              }

            } catch (_) {

              // Response wasn't JSON

            }


            throw new Error(
              message
            );

          }


          // -----------------------------------------------
          // Get generated image
          // -----------------------------------------------

          const blob =
            await response.blob();


          console.log(
            "Response:",
            blob.type,
            blob.size
          );


          if (
            !blob.type.startsWith(
              "image/"
            )
          ) {

            throw new Error(
              "Server did not return an image."
            );

          }


          // -----------------------------------------------
          // Create preview URL
          // -----------------------------------------------

          if (resultURL) {

            URL.revokeObjectURL(
              resultURL
            );

          }


          resultURL =
            URL.createObjectURL(
              blob
            );


          resultImage.src =
            resultURL;


          downloadBtn.href =
            resultURL;


          result.style.display =
            "block";


          // Scroll to result

          setTimeout(
            () => {

              result.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

            },
            100
          );


        } catch (error) {

          console.error(
            "ERROR:",
            error
          );


          showError(
            error.message ||
            "Something went wrong."
          );

        } finally {

          generateBtn.disabled =
            false;

          loading.style.display =
            "none";

        }

      }
    );


    // =====================================================
    // ERROR
    // =====================================================

    function showError(message) {

      errorBox.textContent =
        "❌ " + message;

      errorBox.style.display =
        "block";

    }


    function hideError() {

      errorBox.style.display =
        "none";

      errorBox.textContent =
        "";

    }


    // =====================================================
    // FULLSCREEN RESULT
    // =====================================================

    resultImage.addEventListener(
      "click",
      () => {

        if (!resultImage.src) {
          return;
        }


        modalImage.src =
          resultImage.src;


        modal.style.display =
          "flex";

      }
    );


    // Close button

    closeModal.addEventListener(
      "click",
      () => {

        modal.style.display =
          "none";

      }
    );


    // Click outside image

    modal.addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          modal
        ) {

          modal.style.display =
            "none";

        }

      }
    );


    // =====================================================
    // ESC TO CLOSE
    // =====================================================

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Escape"
        ) {

          modal.style.display =
            "none";

        }

      }
    );


    // =====================================================
    // CTRL + ENTER
    // =====================================================

    promptInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.ctrlKey &&
          event.key === "Enter"
        ) {

          generateBtn.click();

        }

      }
    );

  </script>

</body>
</html>

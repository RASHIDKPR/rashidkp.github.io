<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Apps Hub</title>
<style>
:root{--ink:#f3f4f8;--mute:#80849a;--hair:rgba(255,255,255,.08);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#040406}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"SF Pro Display",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(80% 40% at 50% -6%,rgba(255,255,255,.075),transparent 65%),#040406;background-attachment:fixed;overflow-x:hidden}
.home{max-width:520px;margin:0 auto;padding:44px 18px 36px}
h1{margin:0;font-size:2.35rem;font-weight:650;letter-spacing:-.04em;line-height:1.05}
.sub{margin:8px 0 30px;color:var(--mute);font-size:.95rem;letter-spacing:.01em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{position:relative}
.card:last-child{grid-column:1/-1}
.tile{position:relative;width:100%;height:100%;min-height:156px;display:flex;flex-direction:column;justify-content:space-between;gap:26px;padding:18px;text-align:left;color:inherit;font:inherit;cursor:pointer;overflow:hidden;border-radius:26px;border:1px solid var(--hair);background:linear-gradient(168deg,#1d1e23 0%,#0e0e11 46%,#060607 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.17),inset 0 -1px 0 rgba(0,0,0,.7),0 22px 34px -14px rgba(0,0,0,.95);transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,0));pointer-events:none}
.tile:active{transform:scale(.965)}
@media (hover:hover){.tile:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(0,0,0,.7),0 28px 40px -14px rgba(0,0,0,.95)}}
.tile:focus-visible{outline:2px solid #fff;outline-offset:3px}
.chip{position:relative;z-index:1;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.chip svg{width:23px;height:23px;fill:none;stroke:#e9eaef;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tx{position:relative;z-index:1;min-width:0}
.tx b{display:block;font-size:1.06rem;font-weight:600;letter-spacing:-.015em}
.tx span{display:block;margin-top:3px;font-size:.8rem;color:var(--mute)}
.card:last-child .tile{flex-direction:row;align-items:center;min-height:98px;gap:16px;justify-content:flex-start}
.re{position:absolute;z-index:2;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--hair);background:rgba(0,0,0,.35);color:var(--mute);font-size:14px;cursor:pointer;opacity:.55}
.re:hover{opacity:1;color:#fff}
.link{display:block;margin:26px auto 0;background:none;border:0;color:var(--mute);font:inherit;font-size:.82rem;cursor:pointer;padding:8px 12px}
.link:hover{color:var(--ink)}
.view{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:#000}
.view.on{display:flex}
.top{position:relative;display:flex;align-items:center;gap:12px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:rgba(8,8,12,.92);border-bottom:1px solid var(--hair)}
.top::after{content:"";position:absolute;left:10%;right:10%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent)}
.back{padding:8px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.back:active{transform:scale(.95)}
#vt{font-weight:600;font-size:.95rem;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{flex:1;width:100%;border:0;background:#fff}
.pm{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.pm.on{display:flex}
.pb{width:100%;max-width:560px;background:linear-gradient(165deg,#1a1b23,#07080b);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px;box-shadow:0 30px 60px rgba(0,0,0,.8)}
.pb h2{margin:0 0 4px;font-size:1.05rem}
.pb p{margin:0 0 10px;color:var(--mute);font-size:.82rem}
.pb textarea{width:100%;height:42vh;resize:none;background:#000;color:#cfe;border:1px solid var(--hair);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace}
.pr{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pr button{flex:1;min-width:110px;padding:11px;border-radius:12px;border:1px solid var(--hair);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.pr .go{background:#f3f4f8;color:#09090b;border-color:#f3f4f8}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:#14151c;border:1px solid var(--hair);color:#fff;padding:10px 16px;border-radius:12px;display:none;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<main class="home">
  <h1>My Apps</h1>
  <p class="sub" id="dt"></p>
  <div class="grid" id="grid"></div>
  <button class="link" id="loadAll" type="button">Replace app files</button>
</main>
<div class="view" id="view">
  <div class="top"><button class="back" id="back" type="button">‹ Home</button><span id="vt"></span></div>
  <iframe id="fr" title="App"></iframe>
</div>
<div class="pm" id="pm"><div class="pb"><h2>Paste app code</h2><p>Paste the full HTML code of one app. It is matched to the right button automatically.</p><textarea id="pt" spellcheck="false" placeholder="Paste here"></textarea><div class="pr"><button class="go" id="ps" type="button">Save</button><button id="pf" type="button">Choose file</button><button id="pc" type="button">Cancel</button></div></div></div>
<input id="pick" type="file" accept=".html,.htm,text/html" multiple hidden>
<div class="toast" id="toast"></div>

function dec(k){try{return EMB[k]?new TextDecoder().decode(Uint8Array.from(atob(EMB[k]),function(c){return c.charCodeAt(0)})):undefined}catch(e){}}
function get(k){return base(k).then(function(v){return v||dec(k)})}
function base(k){return idb().then(function(d){if(!d)return mem[k];return new Promise(function(res){try{var q=d.transaction("f").objectStore("f").get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){res(mem[k])}}catch(e){res(mem[k])}})})}
function put(k,v){mem[k]=v;return idb().then(function(d){if(!d)return;return new Promise(function(res){try{var t=d.transaction("f","readwrite");t.objectStore("f").put(v,k);t.oncomplete=res;t.onerror=res}catch(e){res()}})})}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},3200)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function draw(){
 var sig=APPS.map(function(a){return has[a.id]?1:0}).join("");
 if(sig===draw.s&&$("grid").children.length)return;draw.s=sig;
 $("dt").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
 $("grid").innerHTML=APPS.map(function(a,k){
  return '<div class="card" style="--c:'+a.c+';--d:'+(k*.14)+'s"><button class="tile" type="button" data-o="'+a.id+'"><span class="chip"><svg viewBox="0 0 24 24">'+a.i+'</svg></span><span class="tx"><b>'+esc(a.n)+'</b><span>'+(has[a.id]?a.s:"Tap to add")+'</span></span></button>'+(has[a.id]?'<button class="re" type="button" data-r="'+a.id+'" aria-label="Replace file">\u21bb</button>':"")+'</div>'}).join("")}
function shim(h){var s="<script>try{window.claude=window.parent.claude}catch(e){}<\/script>";
 return /<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,function(m){return m+s}):s+h}
function openApp(id){
 var a=APPS.filter(function(x){return x.id===id})[0];
 get(id).then(function(h){
  if(!h){target=id;$("pt").value="";$("pm").classList.add("on");return}
  $("view").style.setProperty("--c",a.c);$("vt").textContent=a.n;
  $("fr").srcdoc=shim(h);$("view").classList.add("on")})}
function files(list){
 var arr=[].slice.call(list),done=0,ok=0;if(!arr.length)return;
 arr.forEach(function(f){var r=new FileReader();r.onload=function(){
  var txt=String(r.result),t=(txt.match(/<title>([^<]*)/i)||[0,""])[1],hit=null;
  if(target&&arr.length===1)hit=APPS.filter(function(x){return x.id===target})[0];
  else hit=APPS.filter(function(x){return x.m.test(t)})[0]||APPS.filter(function(x){return x.m.test(f.name)})[0];
  var p=hit?put(hit.id,txt).then(function(){has[hit.id]=1;ok++}):Promise.resolve();
  p.then(function(){if(++done===arr.length){target=null;draw();toast(ok+" of "+arr.length+" file(s) saved"+(ok<arr.length?". Some did not match an app.":""))}})};
  r.onerror=function(){if(++done===arr.length){target=null;draw()}};r.readAsText(f)});
 $("pick").value=""}
$("grid").onclick=function(e){
 var r=e.target.closest("[data-r]");if(r){target=r.dataset.r;$("pt").value="";$("pm").classList.add("on");return}
 var o=e.target.closest("[data-o]");if(o)openApp(o.dataset.o)};
$("loadAll").onclick=function(){target=null;$("pick").click()};
$("pick").onchange=function(){files(this.files)};
$("back").onclick=function(){$("view").classList.remove("on");$("fr").srcdoc=""};
function saveText(txt,forced){var t=(txt.match(/<title>([^<]*)/i)||[0,""])[1];
 var hit=forced?APPS.filter(function(x){return x.id===forced})[0]:APPS.filter(function(x){return x.m.test(t)})[0];
 if(!hit)return Promise.resolve(null);return put(hit.id,txt).then(function(){has[hit.id]=1;return hit})}

$("pc").onclick=function(){target=null;$("pm").classList.remove("on")};
$("pf").onclick=function(){$("pm").classList.remove("on");$("pick").click()};
$("ps").onclick=function(){var v=$("pt").value;if(v.length<200){toast("Paste the full code first");return}
 saveText(v,target).then(function(h){if(!h){toast("Could not tell which app this is. The code needs its title tag.");return}target=null;$("pm").classList.remove("on");draw();toast(h.n+" saved")})};
Promise.all(APPS.map(function(a){return get(a.id).then(function(h){if(h)has[a.id]=1})})).then(draw);
})();

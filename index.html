<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Muhammed Rashid KP | Contact</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #05050a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Moving Neon Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      animation: move 20s infinite alternate ease-in-out;
      z-index: 0;
      pointer-events: none;
    }

    .orb1 {
      width: 380px;
      height: 380px;
      background: #ff00ff;
      top: -120px;
      left: -120px;
      animation-duration: 18s;
    }

    .orb2 {
      width: 320px;
      height: 320px;
      background: #00f0ff;
      bottom: -100px;
      right: -100px;
      animation-duration: 22s;
      animation-delay: -5s;
    }

    .orb3 {
      width: 280px;
      height: 280px;
      background: #9d00ff;
      top: 35%;
      left: 55%;
      animation-duration: 25s;
      animation-delay: -10s;
    }

    .orb4 {
      width: 240px;
      height: 240px;
      background: #00ff9d;
      bottom: 15%;
      left: 5%;
      animation-duration: 20s;
      animation-delay: -3s;
    }

    @keyframes move {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(60px, -50px) scale(1.1); }
      100% { transform: translate(-50px, 30px) scale(0.95); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 10px 0;
    }

    .profile {
      margin-bottom: 28px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff00ff, #00f0ff, #9d00ff);
      background-size: 200% 200%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin: 0 auto 16px;
      box-shadow: 0 0 30px #ff00ff, 0 0 60px #00f0ff;
      animation: glow 4s infinite alternate, gradientShift 6s infinite;
    }

    @keyframes glow {
      0%   { box-shadow: 0 0 25px #ff00ff, 0 0 50px #00f0ff; }
      100% { box-shadow: 0 0 40px #ff00ff, 0 0 80px #00f0ff, 0 0 110px #9d00ff; }
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 1.75rem;
      background: linear-gradient(90deg, #ff00ff, #00f0ff, #9d00ff, #ff00ff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 5s linear infinite;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    @keyframes textShine {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .subtitle {
      color: #aaa;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }

    .link i {
      font-size: 1.25rem;
      width: 26px;
      text-align: center;
      flex-shrink: 0;
    }

    .link:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: #00f0ff;
      box-shadow: 0 0 22px #00f0ff55;
      background: rgba(0, 240, 255, 0.1);
    }

    .link.instagram:hover { border-color: #ff00ff; box-shadow: 0 0 22px #ff00ff55; }
    .link.email:hover     { border-color: #00ff9d; box-shadow: 0 0 22px #00ff9d55; }
    .link.phone:hover     { border-color: #ffaa00; box-shadow: 0 0 22px #ffaa0055; }
    .link.whatsapp:hover  { border-color: #25d366; box-shadow: 0 0 22px #25d36655; }
    .link.github:hover    { border-color: #ffffff; box-shadow: 0 0 22px #ffffff44; }

    footer {
      margin-top: 36px;
      font-size: 0.78rem;
      color: #555;
    }

    /* ========== PC / Large Screens ========== */
    @media (min-width: 768px) {
      body {
        padding: 40px 20px;
      }

      .container {
        max-width: 460px;
      }

      .avatar {
        width: 130px;
        height: 130px;
        font-size: 56px;
      }

      h1 {
        font-size: 2.1rem;
      }

      .subtitle {
        font-size: 1.05rem;
      }

      .link {
        padding: 17px 24px;
        font-size: 1rem;
      }

      .orb1, .orb2, .orb3, .orb4 {
        filter: blur(90px);
        opacity: 0.5;
      }
    }

    /* ========== Very Small Phones ========== */
    @media (max-width: 360px) {
      .container {
        max-width: 100%;
      }

      h1 {
        font-size: 1.5rem;
      }

      .avatar {
        width: 95px;
        height: 95px;
        font-size: 42px;
      }

      .link {
        padding: 13px 16px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>

  <div class="container">
    <div class="profile">
      <div class="avatar">👨‍💻</div>
      <h1>Muhammed Rashid KP</h1>
      <p class="subtitle">Flutter Developer</p>
    </div>

    <div class="links">
      <a href="mailto:your.email@example.com" class="link email">
        <i class="fas fa-envelope" style="color:#00ff9d"></i>
        <span>your.email@example.com</span>
      </a>

      <a href="tel:+91XXXXXXXXXX" class="link phone">
        <i class="fas fa-phone" style="color:#ffaa00"></i>
        <span>+91 XXXXX XXXXX</span>
      </a>

      <a href="https://instagram.com/your_instagram" target="_blank" class="link instagram">
        <i class="fab fa-instagram" style="color:#ff00ff"></i>
        <span>@your_instagram</span>
      </a>

      <a href="https://wa.me/91XXXXXXXXXX" target="_blank" class="link whatsapp">
        <i class="fab fa-whatsapp" style="color:#25d366"></i>
        <span>WhatsApp</span>
      </a>

      <a href="https://github.com/yourusername" target="_blank" class="link github">
        <i class="fab fa-github" style="color:#fff"></i>
        <span>GitHub</span>
      </a>

      <a href="https://linkedin.com/in/yourusername" target="_blank" class="link">
        <i class="fab fa-linkedin" style="color:#00a0dc"></i>
        <span>LinkedIn</span>
      </a>
    </div>

    <footer>
      © 2026 Muhammed Rashid KP
    </footer>
  </div>

</body>
</html>

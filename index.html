<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Rashid AI Studio</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


body {

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: white;

  background:
    radial-gradient(
      circle at 10% 10%,
      #243b55,
      transparent 40%
    ),

    radial-gradient(
      circle at 90% 90%,
      #141e30,
      #05070b
    );

  padding: 20px 12px;
}


.container {

  width: 100%;

  max-width: 950px;

  margin: auto;
}


.header {

  text-align: center;

  padding: 20px 0 25px;
}


.header h1 {

  font-size: 38px;

  margin-bottom: 8px;
}


.header p {

  color: #888;

  font-size: 14px;
}


/* ==========================================
   TABS
========================================== */

.tabs {

  display: flex;

  gap: 8px;

  padding: 6px;

  background:
    rgba(
      255,
      255,
      255,
      0.06
    );

  border-radius: 15px;

  margin-bottom: 20px;
}


.tab {

  flex: 1;

  padding: 13px;

  border: none;

  border-radius: 11px;

  background: transparent;

  color: #888;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;
}


.tab.active {

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #4f46e5
    );

  color: white;
}


/* ==========================================
   CARD
========================================== */

.card {

  background:
    rgba(
      255,
      255,
      255,
      0.07
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.12
    );

  border-radius: 22px;

  padding: 22px;

  backdrop-filter:
    blur(20px);
}


/* ==========================================
   MODE
========================================== */

.mode {

  display: none;
}


.mode.active {

  display: block;
}


/* ==========================================
   UPLOAD
========================================== */

.upload {

  display: block;

  border:
    2px dashed
    #555;

  border-radius: 18px;

  padding: 32px 15px;

  text-align: center;

  cursor: pointer;

  transition: .2s;
}


.upload:hover {

  border-color:
    #8b5cf6;

  background:
    rgba(
      139,
      92,
      246,
      .08
    );
}


.upload-icon {

  font-size: 42px;

  margin-bottom: 8px;
}


.upload small {

  display: block;

  color: #777;

  margin-top: 7px;
}


#imageInput {

  display: none;
}


/* ==========================================
   IMAGE GRID
========================================== */

.image-grid {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

  margin-top: 18px;
}


.image-card {

  position: relative;

  overflow: hidden;

  border-radius: 13px;

  background: #111;

  border:
    1px solid
    #333;
}


.image-card img {

  display: block;

  width: 100%;

  aspect-ratio: 1;

  object-fit: cover;
}


.image-label {

  position: absolute;

  top: 6px;

  left: 6px;

  background:
    rgba(
      0,
      0,
      0,
      .7
    );

  padding:
    4px 7px;

  border-radius: 7px;

  font-size: 10px;
}


.remove {

  position: absolute;

  top: 5px;

  right: 5px;

  width: 27px;

  height: 27px;

  border: none;

  border-radius: 50%;

  background:
    #ef4444;

  color: white;

  cursor: pointer;
}


.image-count {

  text-align: center;

  color: #777;

  font-size: 12px;

  margin-top: 10px;
}


/* ==========================================
   TEXTAREA
========================================== */

textarea {

  width: 100%;

  min-height: 150px;

  margin-top: 20px;

  padding: 16px;

  resize: vertical;

  border-radius: 15px;

  border:
    1px solid
    #444;

  background:
    rgba(
      0,
      0,
      0,
      .35
    );

  color: white;

  font-size: 15px;

  line-height: 1.5;

  outline: none;
}


textarea:focus {

  border-color:
    #8b5cf6;
}


/* ==========================================
   OPTIONS
========================================== */

.options {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-top: 15px;
}


.option {

  padding: 10px;

  border-radius: 10px;

  border:
    1px solid
    #333;

  background:
    rgba(
      0,
      0,
      0,
      .3
    );

  color: #aaa;
}


.option label {

  display: block;

  font-size: 11px;

  margin-bottom: 6px;
}


.option select {

  width: 100%;

  background: #111;

  color: white;

  border: none;

  outline: none;
}


/* ==========================================
   BUTTON
========================================== */

.generate {

  width: 100%;

  margin-top: 18px;

  padding: 16px;

  border: none;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #4f46e5
    );

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}


.generate:disabled {

  opacity: .5;

  cursor: not-allowed;
}


/* ==========================================
   LOADING
========================================== */

.loading {

  display: none;

  text-align: center;

  padding: 25px;
}


.spinner {

  width: 40px;

  height: 40px;

  border:
    4px solid
    #333;

  border-top-color:
    #8b5cf6;

  border-radius: 50%;

  animation:
    spin 1s linear infinite;

  margin: auto;
}


@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}


/* ==========================================
   ERROR
========================================== */

.error {

  display: none;

  margin-top: 15px;

  padding: 13px;

  border-radius: 11px;

  color: #ff8a8a;

  background:
    rgba(
      255,
      0,
      0,
      .13
    );

  border:
    1px solid
    rgba(
      255,
      0,
      0,
      .3
    );
}


/* ==========================================
   RESULT
========================================== */

.result {

  display: none;

  margin-top: 25px;
}


.result-title {

  font-size: 20px;

  margin-bottom: 12px;
}


.result img {

  display: block;

  width: 100%;

  max-height: 750px;

  object-fit: contain;

  border-radius: 17px;

  background: #111;

  cursor: pointer;
}


.result video {

  width: 100%;

  border-radius: 17px;

  background: black;
}


/* ==========================================
   ACTIONS
========================================== */

.actions {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-top: 12px;
}


.action {

  display: block;

  padding: 13px;

  border: none;

  border-radius: 11px;

  text-align: center;

  text-decoration: none;

  cursor: pointer;

  color: white;

  background: #16a34a;

  font-weight: bold;
}


.action.secondary {

  background:
    #333;
}


/* ==========================================
   HISTORY
========================================== */

.history {

  margin-top: 25px;
}


.history h3 {

  margin-bottom: 12px;
}


.history-grid {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 8px;
}


.history-item {

  border-radius: 10px;

  overflow: hidden;

  cursor: pointer;

  background: #111;
}


.history-item img {

  width: 100%;

  aspect-ratio: 1;

  object-fit: cover;
}


/* ==========================================
   MODAL
========================================== */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 9999;

  background:
    rgba(
      0,
      0,
      0,
      .94
    );

  align-items: center;

  justify-content: center;

  padding: 20px;
}


.modal img {

  max-width: 96%;

  max-height: 94%;
}


.close {

  position: absolute;

  top: 12px;

  right: 20px;

  font-size: 42px;

  cursor: pointer;
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:700px) {

  body {

    padding:
      10px 8px;
  }


  .header h1 {

    font-size: 28px;
  }


  .card {

    padding: 16px;
  }


  .image-grid {

    grid-template-columns:
      repeat(2, 1fr);
  }


  .history-grid {

    grid-template-columns:
      repeat(3, 1fr);
  }


  .options {

    grid-template-columns:
      1fr;
  }

}

</style>

</head>


<body>


<div class="container">


<!-- ==========================================
     HEADER
========================================== -->

<div class="header">

  <h1>
    ✨ Rashid AI Studio
  </h1>

  <p>
    Create realistic images and cinematic videos
  </p>

</div>


<!-- ==========================================
     TABS
========================================== -->

<div class="tabs">

  <button
    class="tab active"
    data-mode="imageMode"
  >
    🖼️ Image
  </button>


  <button
    class="tab"
    data-mode="videoMode"
  >
    🎬 Video
  </button>

</div>


<!-- ==========================================
     CARD
========================================== -->

<div class="card">


<!-- =================================================
     IMAGE MODE
================================================= -->

<div
  class="mode active"
  id="imageMode"
>


<label
  class="upload"
  for="imageInput"
>

  <div class="upload-icon">
    📷
  </div>

  <b>
    Add reference images
  </b>

  <small>
    Up to 4 JPG, PNG or WEBP images
  </small>

</label>


<input
  type="file"
  id="imageInput"
  accept="image/png,image/jpeg,image/webp"
  multiple
>


<div
  class="image-grid"
  id="imageGrid"
></div>


<div
  class="image-count"

>
  0 / 4 images
</div>


<textarea
  id="imagePrompt"
  placeholder="Describe what you want...

Example:
Take the person from image 1 and place them beside the person from image 2. Keep the environment from image 1. Use the clothing from image 3. Make everything look like one authentic photograph with natural lighting, realistic shadows, correct perspective and realistic skin texture."
></textarea>


<button
  class="generate"
  id="imageGenerate"
>
  ✨ Generate Image
</button>


<div
  class="loading"
  id="imageLoading"
>

  <div class="spinner"></div>

  <p style="margin-top:12px;color:#888;">
    Creating your image...
  </p>

<div
  class="error"
  id="imageError"
></div>


<div
  class="result"
  id="imageResult"
>

  <div class="result-title">
    ✨ Result
  </div>


  <img
    id="generatedImage"
    alt="Generated image"
  >


  <div class="actions">

    <a
      class="action"
      id="imageDownload"
      download="rashid-ai.png"
    >
      ⬇️ Download
    </a>


    <button
      class="action secondary"
      id="editAgain"
    >
      🔄 Edit Again
    </button>

  </div>

</div>


<div
  class="history"
  id="historySection"
  style="display:none;"
>

  <h3>
    🕘 History
  </h3>

  <div
    class="history-grid"
    id="historyGrid"
  ></div>

</div>

</div>


<!-- =================================================
     VIDEO MODE
================================================= -->

<div
  class="mode"
  id="videoMode"
>


<textarea

  placeholder="Describe your video...

Example:
A young man standing in a beautiful garden smiles naturally at the camera. His hair moves gently in the breeze. The camera slowly pushes forward. Natural sunlight, realistic skin texture, cinematic smartphone footage, subtle handheld movement."
></textarea>


<div class="options">


  <div class="option">

      <option value="9:16">

      <option value="3:4">

        Adaptive
      </option>

  </div>


  <div class="option">

    <label>
      Duration
    </label>

    <select id="videoDuration">

      <option value="5">
        5 seconds

      <option value="8">
        8 seconds
      </option>

      <option value="10">
        10 seconds
      </option>

    </select>

  </div>

</div>


<button
  class="generate"
  id="videoGenerate"
>
  🎬 Generate Video
</button>


<div
  class="loading"
  id="videoLoading"
>

  <div class="spinner"></div>

  <p style="margin-top:12px;color:#888;">
    Creating your video...
  </p>

</div>


<div
  class="error"
  id="videoError"
></div>


<div
  class="result"
  id="videoResult"
>

  <div class="result-title">
    🎬 Result
  </div>


  <video
    id="generatedVideo"
    controls
    playsinline
  ></video>


  <div class="actions">

    <a
      class="action"
      id="videoDownload"
      target="_blank"
      rel="noopener"
    >
      ⬇️ Open / Download
    </a>

</div>

</div>


</div>

</div>


<!-- ==========================================
     MODAL
========================================== -->

<div
  class="modal"
  id="modal"
>

  <div
    class="close"
    id="closeModal"
  >
    ×
  </div>

  <img
    id="modalImage"
  >

</div>


<script>


// =================================================
// CONFIG
// =================================================

const API =
  "https://image-api.itsmerashidkp.workers.dev";


// =================================================
// ELEMENTS
// =================================================

const tabs =
  document.querySelectorAll(
    ".tab"
  );

const modes =
  document.querySelectorAll(
    ".mode"
  );


// =================================================
// TAB SWITCH
// =================================================

tabs.forEach(tab => {

  tab.addEventListener(
    "click",
    () => {

      const mode =
        tab.dataset.mode;


      tabs.forEach(t =>
        t.classList.remove(
          "active"
        )
      );


      modes.forEach(m =>
        m.classList.remove(
          "active"
        )
      );


      tab.classList.add(
        "active"
      );


      document
        .getElementById(mode)
        .classList.add(
          "active"
        );

    }
  );

});


// =================================================
// IMAGE VARIABLES
// =================================================

const imageInput =
  document.getElementById(
    "imageInput"
  );

const imageGrid =
  document.getElementById(
    "imageGrid"
  );

const imageCount =
  document.getElementById(
    "imageCount"
  );

const imagePrompt =
  document.getElementById(
    "imagePrompt"
  );

const imageGenerate =
  document.getElementById(
    "imageGenerate"
  );

const imageLoading =
  document.getElementById(
    "imageLoading"
  );

const imageError =
  document.getElementById(
    "imageError"
  );

const imageResult =
  document.getElementById(
    "imageResult"
  );

const generatedImage =
  document.getElementById(
    "generatedImage"
  );

const imageDownload =
  document.getElementById(
    "imageDownload"
  );

const editAgain =
  document.getElementById(
    "editAgain"
  );

const historySection =
  document.getElementById(
    "historySection"
  );

const historyGrid =
  document.getElementById(
    "historyGrid"
  );


let selectedFiles = [];

let generatedImageURL = null;

let history = [];


// =================================================
// IMAGE SELECT
// =================================================

imageInput.addEventListener(
  "change",
  () => {

    addImages(
      Array.from(
        imageInput.files
      )
    );

    imageInput.value = "";

  }
);


// =================================================
// ADD IMAGES
// =================================================

function addImages(files) {

  for (
    const file of files
  ) {

    if (
      selectedFiles.length >= 4
    ) {

      showImageError(
        "Maximum 4 images allowed."
      );

      break;
    }


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      continue;
    }


    selectedFiles.push(
      file
    );

  }


  renderImages();

}


// =================================================
// RENDER REFERENCES
// =================================================

function renderImages() {

  imageGrid.innerHTML = "";


  selectedFiles.forEach(
    (file, index) => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "image-card";


      const img =
        document.createElement(
          "img"
        );


      const reader =
        new FileReader();


      reader.onload =
        () => {

          img.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "image-label";


      label.textContent =
        `Image ${index + 1}`;


      const remove =
        document.createElement(
          "button"
        );


      remove.className =
        "remove";


      remove.textContent =
        "×";


      remove.onclick =
        () => {

          selectedFiles.splice(
            index,
            1
          );

          renderImages();

        };


      card.appendChild(
        img
      );

      card.appendChild(
        label
      );

      card.appendChild(
        remove
      );


      imageGrid.appendChild(
        card
      );

    }
  );


  imageCount.textContent =
    `${selectedFiles.length} / 4 images`;

}


// =================================================
// RESIZE
// =================================================

function resizeImage(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const img =
            new Image();


          img.onload =
            () => {

              const max =
                511;


              let width =
                img.naturalWidth;

              let height =
                img.naturalHeight;


              if (
                width > max ||
                height > max
              ) {

                const scale =
                  Math.min(
                    max / width,
                    max / height
                  );


                width =
                  Math.round(
                    width * scale
                  );


                height =
                  Math.round(
                    height * scale
                  );

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              canvas.toBlob(
                blob => {

                  if (!blob) {

                    reject(
                      new Error(
                        "Image conversion failed."
                      )
                    );

                    return;
                  }


                  resolve(
                    blob
                  );

                },
                "image/jpeg",
                .9
              );

            };


          img.onerror =
            () => {

              reject(
                new Error(
                  "Invalid image."
                )
              );

            };


          img.src =
            reader.result;

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              "Could not read image."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


// =================================================
// IMAGE GENERATE
// =================================================

imageGenerate.onclick =
  async () => {

    hideImageError();


    if (
      selectedFiles.length === 0
    ) {

      showImageError(
        "Add at least one reference image."
      );

      return;
    }


    const prompt =
      imagePrompt.value.trim();


    if (!prompt) {

      showImageError(
        "Enter an image prompt."
      );

      return;
    }


    imageGenerate.disabled =
      true;

    imageLoading.style.display =
      "block";

    imageResult.style.display =
      "none";


    try {

      const form =
        new FormData();


      form.append(
        "prompt",
        prompt
      );


      for (
        let i = 0;
        i < selectedFiles.length;
        i++
      ) {

        const resized =
          await resizeImage(
            selectedFiles[i]
          );


        form.append(
          "image",
          resized,
          `image_${i + 1}.jpg`
        );

      }


      const response =
        await fetch(
          `${API}/image`,
          {
            method:
              "POST",

            body:
              form
          }
        );


      if (!response.ok) {

        let message =
          "Image generation failed.";


        try {

          const data =
            await response.json();


          message =
            data.error ||
            message;

        }
        catch (_) {}


        throw new Error(
          message
        );

      }


      const blob =
        await response.blob();


      if (
        !blob.type.startsWith(
          "image/"
        )
      ) {

        throw new Error(
          "Server did not return an image."
        );

      }


      if (
        generatedImageURL
      ) {

        URL.revokeObjectURL(
          generatedImageURL
        );

      }


      generatedImageURL =
        URL.createObjectURL(
          blob
        );


      generatedImage.src =
        generatedImageURL;


      imageDownload.href =
        generatedImageURL;


      imageResult.style.display =
        "block";


      // Add history

      addHistory(
        generatedImageURL,
        prompt
      );


      imageResult.scrollIntoView({
        behavior:
          "smooth"
      });


    }
    catch (error) {

      console.error(
        error
      );


      showImageError(
        error.message
      );

    }
    finally {

      imageGenerate.disabled =
        false;

      imageLoading.style.display =
        "none";

    }

  };


// =================================================
// EDIT AGAIN
// =================================================

editAgain.onclick =
  async () => {

    if (
      !generatedImage.src
    ) {
      return;
    }


    try {

      const response =
        await fetch(
          generatedImage.src
        );


      const blob =
        await response.blob();


      const file =
        new File(
          [
            blob
          ],
          "previous-result.jpg",
          {
            type:
              "image/jpeg"
          }
        );


      // Use generated result
      // as Image 1

      selectedFiles =
        [file];


      renderImages();


      imagePrompt.value =
        "Edit this image again. Keep the subject and composition realistic. " +
        "Make the requested changes while preserving natural lighting, " +
        "realistic skin texture, perspective and photographic detail.";


      window.scrollTo({
        top: 0,
        behavior:
          "smooth"
      });

    }
    catch (error) {

      showImageError(
        "Could not reuse the generated image."
      );

    }

  };


// =================================================
// HISTORY
// =================================================

function addHistory(
  url,
  prompt
) {

  history.unshift({
    url,
    prompt
  });


  // Maximum 8

  if (
    history.length > 8
  ) {

    history.pop();

  }


  renderHistory();

}


function renderHistory() {

  historyGrid.innerHTML = "";


  history.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "history-item";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        item.url;


      img.title =
        item.prompt;


      img.onclick =
        () => {

          generatedImage.src =
            item.url;

          imageDownload.href =
            item.url;

          imageResult.style.display =
            "block";

        };


      div.appendChild(
        img
      );


      historyGrid.appendChild(
        div
      );

    }
  );


  historySection.style.display =
    history.length
      ? "block"
      : "none";

}


// =================================================
// IMAGE ERRORS
// =================================================

function showImageError(
  message
) {

  imageError.textContent =
    "❌ " + message;

  imageError.style.display =
    "block";

}


function hideImageError() {

  imageError.style.display =
    "none";

}


// =================================================
// VIDEO VARIABLES
// =================================================

const videoPrompt =
  document.getElementById(
    "videoPrompt"
  );

const videoResolution =
  document.getElementById(
    "videoResolution"
  );

const videoRatio =
  document.getElementById(
    "videoRatio"
  );

const videoDuration =
  document.getElementById(
    "videoDuration"
  );

const videoGenerate =
  document.getElementById(
    "videoGenerate"
  );

const videoLoading =
  document.getElementById(
    "videoLoading"
  );

const videoError =
  document.getElementById(
    "videoError"
  );

const videoResult =
  document.getElementById(
    "videoResult"
  );

const generatedVideo =
  document.getElementById(
    "generatedVideo"
  );

const videoDownload =
  document.getElementById(
    "videoDownload"
  );


// =================================================
// VIDEO GENERATE
// =================================================

videoGenerate.onclick =
  async () => {

    hideVideoError();


    const prompt =
      videoPrompt.value.trim();


    if (!prompt) {

      showVideoError(
        "Enter a video prompt."
      );

      return;
    }


    videoGenerate.disabled =
      true;

    videoLoading.style.display =
      "block";

    videoResult.style.display =
      "none";


    try {

      const response =
        await fetch(
          `${API}/video`,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                prompt:

                  prompt,

                resolution:

                  videoResolution.value,

                ratio:

                  videoRatio.value,

                duration:

                  Number(
                    videoDuration.value
                  )

              })
          }
        );


      if (!response.ok) {

        let message =
          "Video generation failed.";


        try {

          const data =
            await response.json();


          message =
            data.error ||
            message;

        }
        catch (_) {}


        throw new Error(
          message
        );

      }


      const data =
        await response.json();


      if (
        !data.video
      ) {

        throw new Error(
          "No video URL returned."
        );

      }


      generatedVideo.src =
        data.video;


      videoDownload.href =
        data.video;


      videoResult.style.display =
        "block";


      generatedVideo.load();


      videoResult.scrollIntoView({
        behavior:
          "smooth"
      });


    }
    catch (error) {

      console.error(
        error
      );


      showVideoError(
        error.message
      );

    }
    finally {

      videoGenerate.disabled =
        false;

      videoLoading.style.display =
        "none";

    }

  };


// =================================================
// VIDEO ERROR
// =================================================

function showVideoError(
  message
) {

  videoError.textContent =
    "❌ " + message;

  videoError.style.display =
    "block";

}


function hideVideoError() {

  videoError.style.display =
    "none";

}


// =================================================
// IMAGE FULLSCREEN
// =================================================

const modal =
  document.getElementById(
    "modal"
  );

const modalImage =
  document.getElementById(
    "modalImage"
  );

const closeModal =
  document.getElementById(
    "closeModal"
  );


generatedImage.onclick =
  () => {

    modalImage.src =
      generatedImage.src;

    modal.style.display =
      "flex";

  };


closeModal.onclick =
  () => {

    modal.style.display =
      "none";

  };


modal.onclick =
  event => {

    if (
      event.target === modal
    ) {

      modal.style.display =
        "none";

    }

  };


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      modal.style.display =
        "none";

    }

  }
);

</script>

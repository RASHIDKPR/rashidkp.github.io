<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Rashid Photos</title>

  <meta
    name="description"
    content="Rashid Photos - Personal photo and video storage"
  />

  <style>
    :root {
      --bg: #08090b;
      --surface: #101216;
      --surface-2: #17191e;
      --surface-3: #202329;
      --border: rgba(255,255,255,.08);
      --text: #f5f7fa;
      --muted: #9da3ad;
      --accent: #8b5cf6;
      --accent-2: #6d5dfc;
      --danger: #ef4444;
      --success: #22c55e;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 20% 0%,
          rgba(139,92,246,.10),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 10%,
          rgba(59,130,246,.07),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      background: rgba(8,9,11,.78);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      width: min(1500px, calc(100% - 32px));
      margin: auto;

      min-height: 74px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 180px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;

      border-radius: 13px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #6366f1
        );

      box-shadow:
        0 10px 30px rgba(99,102,241,.3);

      font-size: 21px;
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -.4px;
    }

    .brand-text span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);

      transition: .2s ease;
    }

    .icon-btn:hover {
      background: var(--surface-3);
      transform: translateY(-1px);
    }

    .upload-btn {
      height: 44px;
      padding: 0 17px;

      display: flex;
      align-items: center;
      gap: 8px;

      color: white;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );

      box-shadow:
        0 10px 25px rgba(99,102,241,.24);

      font-weight: 700;

      transition: .2s ease;
    }

    .upload-btn:hover {
      transform: translateY(-1px);
      box-shadow:
        0 14px 32px rgba(99,102,241,.32);
    }

    /* =========================================================
       MAIN
    ========================================================= */

    main {
      width: min(1500px, calc(100% - 32px));
      margin: auto;
      padding: 30px 0 70px;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 25px;

      margin-bottom: 25px;
    }

    .hero h2 {
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -1.4px;
      line-height: 1.05;
    }

    .hero p {
      color: var(--muted);
      margin-top: 9px;
      font-size: 14px;
    }

    .stats {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 9px 13px;
      border-radius: 12px;

      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      color: var(--text);
      margin-right: 4px;
    }

    /* =========================================================
       TOOLBAR
    ========================================================= */

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      margin-bottom: 25px;

      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 6px;

      padding: 5px;

      background: var(--surface);
      border: 1px solid var(--border);

      border-radius: 14px;
    }

    .filter-btn {
      padding: 9px 15px;

      border-radius: 10px;

      color: var(--muted);
      background: transparent;

      font-size: 13px;
      font-weight: 650;

      transition: .2s ease;
    }

    .filter-btn:hover {
      color: var(--text);
    }

    .filter-btn.active {
      color: white;
      background: var(--surface-3);
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }

    .search-box {
      width: min(330px, 100%);

      display: flex;
      align-items: center;
      gap: 9px;

      height: 43px;
      padding: 0 13px;

      background: var(--surface);
      border: 1px solid var(--border);

      border-radius: 12px;
    }

    .search-box span {
      color: var(--muted);
    }

    .search-box input {
      width: 100%;

      border: none;
      outline: none;

      background: transparent;
      color: var(--text);

      font-size: 13px;
    }

    .search-box input::placeholder {
      color: #666c76;
    }

    /* =========================================================
       DROP ZONE
    ========================================================= */

    .drop-zone {
      margin-bottom: 26px;

      border: 1px dashed rgba(139,92,246,.35);
      background:
        linear-gradient(
          135deg,
          rgba(139,92,246,.06),
          rgba(99,102,241,.02)
        );

      border-radius: 18px;

      min-height: 110px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 20px;

      transition: .25s ease;
    }

    .drop-zone.dragging {
      border-color: var(--accent);
      background: rgba(139,92,246,.13);
      transform: scale(1.005);
    }

    .drop-content {
      color: var(--muted);
    }

    .drop-content strong {
      display: block;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 5px;
    }

    .drop-content span {
      font-size: 12px;
    }

    /* =========================================================
       GALLERY
    ========================================================= */

    .gallery {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(190px, 1fr)
        );

      gap: 12px;
    }

    .media-card {
      position: relative;

      aspect-ratio: 1 / 1;

      overflow: hidden;

      border-radius: 14px;

      background: var(--surface);
      border: 1px solid var(--border);

      cursor: pointer;

      box-shadow: 0 6px 25px rgba(0,0,0,.12);

      animation: cardIn .35s ease both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .media-card img,
    .media-card video {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transition: transform .35s ease;
    }

    .media-card:hover img,
    .media-card:hover video {
      transform: scale(1.045);
    }

    .media-overlay {
      position: absolute;
      inset: auto 0 0 0;

      padding: 35px 11px 10px;

      background:
        linear-gradient(
          transparent,
          rgba(0,0,0,.72)
        );

      opacity: 0;

      transition: .2s ease;
    }

    .media-card:hover .media-overlay {
      opacity: 1;
    }

    .media-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      font-size: 11px;
      color: white;
    }

    .video-badge {
      position: absolute;
      top: 9px;
      left: 9px;

      display: flex;
      align-items: center;
      gap: 5px;

      padding: 5px 8px;

      border-radius: 8px;

      background: rgba(0,0,0,.62);
      backdrop-filter: blur(8px);

      font-size: 10px;
      color: white;
    }

    .card-menu {
      position: absolute;
      top: 8px;
      right: 8px;

      width: 31px;
      height: 31px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      color: white;
      background: rgba(0,0,0,.58);

      backdrop-filter: blur(8px);

      opacity: 0;
      transition: .2s ease;
    }

    .media-card:hover .card-menu {
      opacity: 1;
    }

    .card-menu:hover {
      background: rgba(239,68,68,.85);
    }

    /* =========================================================
       EMPTY STATE
    ========================================================= */

    .empty {
      padding: 80px 20px;

      text-align: center;

      background: var(--surface);
      border: 1px solid var(--border);

      border-radius: 20px;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 15px;
      opacity: .8;
    }

    .empty h3 {
      font-size: 17px;
    }

    .empty p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 7px;
    }

    /* =========================================================
       SKELETON
    ========================================================= */

    .skeleton {
      aspect-ratio: 1;
      border-radius: 14px;

      background:
        linear-gradient(
          90deg,
          var(--surface) 25%,
          var(--surface-3) 50%,
          var(--surface) 75%
        );

      background-size: 200% 100%;

      animation: shimmer 1.3s infinite;
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal {
      position: fixed;
      inset: 0;

      z-index: 500;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0,0,0,.84);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .modal.open {
      display: flex;
    }

    .viewer {
      width: min(1200px, 100%);
      height: min(90vh, 850px);

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050506;

      border: 1px solid var(--border);
      border-radius: 18px;

      overflow: hidden;

      box-shadow: var(--shadow);
    }

    .viewer img,
    .viewer video {
      max-width: 100%;
      max-height: 100%;

      object-fit: contain;
    }

    .viewer-top {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;

      z-index: 5;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .viewer-name {
      max-width: 60%;

      padding: 9px 12px;

      border-radius: 10px;

      background: rgba(0,0,0,.6);
      backdrop-filter: blur(10px);

      color: white;

      font-size: 12px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .viewer-actions {
      display: flex;
      gap: 7px;
    }

    .viewer-btn {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background: rgba(0,0,0,.6);
      backdrop-filter: blur(10px);

      color: white;

      transition: .2s ease;
    }

    .viewer-btn:hover {
      background: rgba(255,255,255,.14);
    }

    .viewer-btn.delete:hover {
      background: var(--danger);
    }

    /* =========================================================
       UPLOAD PANEL
    ========================================================= */

    .upload-panel {
      position: fixed;
      right: 20px;
      bottom: 20px;

      z-index: 400;

      width: min(390px, calc(100% - 40px));

      background: rgba(18,20,24,.95);
      backdrop-filter: blur(18px);

      border: 1px solid var(--border);

      border-radius: 18px;

      box-shadow: var(--shadow);

      padding: 16px;

      display: none;
    }

    .upload-panel.open {
      display: block;
      animation: panelIn .25s ease;
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .upload-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 13px;
    }

    .upload-panel-head strong {
      font-size: 14px;
    }

    .upload-list {
      max-height: 260px;
      overflow-y: auto;
    }

    .upload-item {
      display: grid;
      grid-template-columns: 38px 1fr auto;

      align-items: center;
      gap: 9px;

      padding: 9px 0;

      border-bottom: 1px solid var(--border);
    }

    .upload-thumb {
      width: 38px;
      height: 38px;

      border-radius: 8px;

      object-fit: cover;

      background: var(--surface-3);
    }

    .upload-info {
      min-width: 0;
    }

    .upload-name {
      font-size: 11px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .upload-status {
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px;
    }

    .progress {
      height: 4px;

      margin-top: 5px;

      overflow: hidden;

      border-radius: 99px;

      background: var(--surface-3);
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      background: linear-gradient(
        90deg,
        var(--accent),
        #60a5fa
      );

      transition: width .15s ease;
    }

    .upload-percent {
      color: var(--muted);
      font-size: 10px;
    }

    /* =========================================================
       TOAST
    ========================================================= */

    .toast-container {
      position: fixed;

      right: 20px;
      top: 90px;

      z-index: 1000;

      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .toast {
      min-width: 240px;

      padding: 12px 14px;

      background: rgba(25,27,32,.96);
      backdrop-filter: blur(15px);

      border: 1px solid var(--border);

      border-radius: 12px;

      box-shadow: var(--shadow);

      font-size: 12px;

      animation: toastIn .25s ease;
    }

    .toast.success {
      border-left: 3px solid var(--success);
    }

    .toast.error {
      border-left: 3px solid var(--danger);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(15px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 800px) {
      .header-inner,
      main {
        width: min(100% - 20px, 1500px);
      }

      .header-inner {
        min-height: 64px;
      }

      .brand-text span {
        display: none;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero h2 {
        font-size: 30px;
      }

      .toolbar {
        align-items: stretch;
      }

      .filters {
        width: 100%;
        overflow-x: auto;
      }

      .filter-btn {
        white-space: nowrap;
      }

      .search-box {
        width: 100%;
      }

      .gallery {
        grid-template-columns:
          repeat(
            auto-fill,
            minmax(125px, 1fr)
          );

        gap: 6px;
      }

      .media-card {
        border-radius: 9px;
      }

      .media-overlay,
      .card-menu {
        opacity: 1;
      }

      .upload-btn span {
        display: none;
      }

      .upload-btn {
        width: 44px;
        padding: 0;
        justify-content: center;
      }

      .drop-zone {
        min-height: 90px;
      }

      .stats {
        width: 100%;
      }
    }

    @media (max-width: 430px) {
      .brand-text h1 {
        font-size: 16px;
      }

      .brand-icon {
        width: 38px;
        height: 38px;
      }

      .icon-btn {
        width: 39px;
        height: 39px;
      }

      .upload-btn {
        height: 39px;
        width: 39px;
      }

      .gallery {
        grid-template-columns:
          repeat(
            3,
            1fr
          );
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       HEADER
  ======================================================== -->

  <header>
    <div class="header-inner">

      <div class="brand">
        <div class="brand-icon">
          📸
        </div>

        <div class="brand-text">
          <h1>Rashid Photos</h1>
          <span>Personal media storage</span>
        </div>
      </div>

      <div class="header-actions">

        <button
          class="icon-btn"
          id="refreshBtn"
          title="Refresh"
        >
          ↻
        </button>

        <button
          class="upload-btn"
          id="uploadBtn"
        >
          <span>＋ Upload</span>
          <b>＋</b>
        </button>

      </div>

    </div>
  </header>


  <!-- =======================================================
       MAIN
  ======================================================== -->

  <main>

    <section class="hero">

      <div>
        <h2>Your memories.</h2>
        <p>
          Photos and videos stored safely in your media library.
        </p>
      </div>

      <div class="stats">
        <div class="stat">
          <strong id="totalCount">0</strong>
          total
        </div>

        <div class="stat">
          <strong id="photoCount">0</strong>
          photos
        </div>

        <div class="stat">
          <strong id="videoCount">0</strong>
          videos
        </div>
      </div>

    </section>


    <!-- =====================================================
         TOOLBAR
    ====================================================== -->

    <section class="toolbar">

      <div class="filters">

        <button
          class="filter-btn active"
          data-filter="all"
        >
          All
        </button>

        <button
          class="filter-btn"
          data-filter="image"
        >
          📷 Photos
        </button>

        <button
          class="filter-btn"
          data-filter="video"
        >
          🎥 Videos
        </button>

      </div>


      <div class="search-box">

        <span>⌕</span>

        <input
          type="search"
          id="searchInput"
          placeholder="Search media..."
          autocomplete="off"
        />

      </div>

    </section>


    <!-- =====================================================
         DROP ZONE
    ====================================================== -->

    <section
      class="drop-zone"
      id="dropZone"
    >

      <div class="drop-content">

        <strong>
          Drop photos or videos here
        </strong>

        <span>
          or click the Upload button above
        </span>

      </div>

    </section>


    <!-- =====================================================
         GALLERY
    ====================================================== -->

    <section
      class="gallery"
      id="gallery"
    ></section>


    <!-- =====================================================
         EMPTY STATE
    ====================================================== -->

    <section
      class="empty"
      id="emptyState"
      style="display:none;"
    >

      <div class="empty-icon">
        🖼️
      </div>

      <h3>
        No media found
      </h3>

      <p>
        Upload your first photo or video to get started.
      </p>

    </section>

  </main>


  <!-- =======================================================
       FILE INPUT
  ======================================================== -->

  <input
    type="file"
    id="fileInput"
    multiple
    accept="image/*,video/*"
    hidden
  />


  <!-- =======================================================
       VIEWER MODAL
  ======================================================== -->

  <div
    class="modal"
    id="viewerModal"
  >

    <div class="viewer">

      <div class="viewer-top">

        <div
          class="viewer-name"
          id="viewerName"
        ></div>

        <div class="viewer-actions">

          <button
            class="viewer-btn"
            id="downloadBtn"
            title="Download"
          >
            ↓
          </button>

          <button
            class="viewer-btn delete"
            id="viewerDeleteBtn"
            title="Delete"
          >
            🗑
          </button>

          <button
            class="viewer-btn"
            id="closeViewerBtn"
            title="Close"
          >
            ✕
          </button>

        </div>

      </div>

      <div id="viewerContent"></div>

    </div>

  </div>


  <!-- =======================================================
       UPLOAD PANEL
  ======================================================== -->

  <div
    class="upload-panel"
    id="uploadPanel"
  >

    <div class="upload-panel-head">

      <strong>
        Uploading
      </strong>

      <button
        class="icon-btn"
        id="closeUploadPanel"
        style="width:30px;height:30px;"
      >
        ✕
      </button>

    </div>

    <div
      class="upload-list"
      id="uploadList"
    ></div>

  </div>


  <!-- =======================================================
       TOASTS
  ======================================================== -->

  <div
    class="toast-container"
    id="toastContainer"
  ></div>


  <script>
    /* =========================================================
       CONFIG
    ========================================================= */

    const API =
      "https://image-uploader.itsmerashidkp.workers.dev";


    /* =========================================================
       STATE
    ========================================================= */

    let media = [];

    let currentFilter = "all";

    let currentViewerItem = null;


    /* =========================================================
       DOM
    ========================================================= */

    const gallery =
      document.getElementById("gallery");

    const emptyState =
      document.getElementById("emptyState");

    const fileInput =
      document.getElementById("fileInput");

    const uploadBtn =
      document.getElementById("uploadBtn");

    const refreshBtn =
      document.getElementById("refreshBtn");

    const dropZone =
      document.getElementById("dropZone");

    const searchInput =
      document.getElementById("searchInput");

    const viewerModal =
      document.getElementById("viewerModal");

    const viewerContent =
      document.getElementById("viewerContent");

    const viewerName =
      document.getElementById("viewerName");

    const downloadBtn =
      document.getElementById("downloadBtn");

    const viewerDeleteBtn =
      document.getElementById("viewerDeleteBtn");

    const closeViewerBtn =
      document.getElementById("closeViewerBtn");

    const uploadPanel =
      document.getElementById("uploadPanel");

    const uploadList =
      document.getElementById("uploadList");

    const closeUploadPanel =
      document.getElementById("closeUploadPanel");

    const toastContainer =
      document.getElementById("toastContainer");


    /* =========================================================
       INIT
    ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      () => {
        loadMedia();
      }
    );


    /* =========================================================
       LOAD MEDIA
    ========================================================= */

    async function loadMedia() {

      showSkeletons();

      try {

        const response =
          await fetch(`${API}/media`);

        if (!response.ok) {
          throw new Error(
            `Server returned ${response.status}`
          );
        }

        const data =
          await response.json();

        if (!data.success) {
          throw new Error(
            data.error || "Failed to load media"
          );
        }

        media =
          Array.isArray(data.files)
            ? data.files
            : [];

        updateStats();

        renderGallery();

      } catch (error) {

        console.error(error);

        gallery.innerHTML = "";

        emptyState.style.display =
          "block";

        showToast(
          "Could not load your media.",
          "error"
        );

      }

    }


    /* =========================================================
       SKELETON
    ========================================================= */

    function showSkeletons() {

      emptyState.style.display =
        "none";

      gallery.innerHTML =
        Array.from(
          { length: 12 },
          () => `<div class="skeleton"></div>`
        ).join("");

    }


    /* =========================================================
       STATS
    ========================================================= */

    function updateStats() {

      const photos =
        media.filter(
          item =>
            (item.type || "")
              .startsWith("image/")
        );

      const videos =
        media.filter(
          item =>
            (item.type || "")
              .startsWith("video/")
        );

      document.getElementById(
        "totalCount"
      ).textContent =
        media.length;

      document.getElementById(
        "photoCount"
      ).textContent =
        photos.length;

      document.getElementById(
        "videoCount"
      ).textContent =
        videos.length;

    }


    /* =========================================================
       FILTER
    ========================================================= */

    document
      .querySelectorAll(".filter-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".filter-btn")
              .forEach(btn =>
                btn.classList.remove("active")
              );

            button.classList.add("active");

            currentFilter =
              button.dataset.filter;

            renderGallery();

          }
        );

      });


    /* =========================================================
       SEARCH
    ========================================================= */

    searchInput.addEventListener(
      "input",
      () => {
        renderGallery();
      }
    );


    /* =========================================================
       GET FILTERED MEDIA
    ========================================================= */

    function getFilteredMedia() {

      const query =
        searchInput.value
          .trim()
          .toLowerCase();

      return media.filter(item => {

        const type =
          item.type || "";

        let matchesFilter = true;

        if (currentFilter === "image") {
          matchesFilter =
            type.startsWith("image/");
        }

        if (currentFilter === "video") {
          matchesFilter =
            type.startsWith("video/");
        }

        const matchesSearch =
          !query ||
          (item.name || "")
            .toLowerCase()
            .includes(query);

        return (
          matchesFilter &&
          matchesSearch
        );

      });

    }


    /* =========================================================
       RENDER GALLERY
    ========================================================= */

    function renderGallery() {

      const items =
        getFilteredMedia();

      gallery.innerHTML = "";

      if (items.length === 0) {

        emptyState.style.display =
          "block";

        return;

      }

      emptyState.style.display =
        "none";


      items.forEach(
        (item, index) => {

          const card =
            document.createElement("article");

          card.className =
            "media-card";

          card.style.animationDelay =
            `${Math.min(index * 25, 300)}ms`;


          const isVideo =
            (item.type || "")
              .startsWith("video/");


          if (isVideo) {

            card.innerHTML = `

              <video
                src="${escapeAttribute(item.url)}"
                muted
                preload="metadata"
                playsinline
              ></video>

              <div class="video-badge">
                ▶ Video
              </div>

            `;

          } else {

            card.innerHTML = `

              <img
                src="${escapeAttribute(item.url)}"
                alt="${escapeAttribute(item.name)}"
                loading="lazy"
                decoding="async"
              />

            `;

          }


          card.innerHTML += `

            <div class="media-overlay">
              <div class="media-name">
                ${escapeHtml(item.name)}
              </div>
            </div>

            <button
              class="card-menu"
              title="Delete"
            >
              🗑
            </button>

          `;


          const deleteButton =
            card.querySelector(".card-menu");


          deleteButton.addEventListener(
            "click",
            event => {

              event.stopPropagation();

              deleteMedia(item);

            }
          );


          card.addEventListener(
            "click",
            () => {

              openViewer(item);

            }
          );


          gallery.appendChild(card);

        }
      );

    }


    /* =========================================================
       FILE PICKER
    ========================================================= */

    uploadBtn.addEventListener(
      "click",
      () => {
        fileInput.click();
      }
    );


    fileInput.addEventListener(
      "change",
      () => {

        const files =
          Array.from(fileInput.files);

        if (files.length) {
          uploadFiles(files);
        }

        fileInput.value = "";

      }
    );


    /* =========================================================
       DRAG & DROP
    ========================================================= */

    [
      "dragenter",
      "dragover"
    ].forEach(eventName => {

      dropZone.addEventListener(
        eventName,
        event => {

          event.preventDefault();
          event.stopPropagation();

          dropZone.classList.add(
            "dragging"
          );

        }
      );

    });


    [
      "dragleave",
      "drop"
    ].forEach(eventName => {

      dropZone.addEventListener(
        eventName,
        event => {

          event.preventDefault();
          event.stopPropagation();

          dropZone.classList.remove(
            "dragging"
          );

        }
      );

    });


    dropZone.addEventListener(
      "drop",
      event => {

        const files =
          Array.from(
            event.dataTransfer.files
          ).filter(
            file =>
              file.type.startsWith("image/") ||
              file.type.startsWith("video/")
          );

        if (files.length) {
          uploadFiles(files);
        }

      }
    );


    /* =========================================================
       UPLOAD FILES
    ========================================================= */

    async function uploadFiles(files) {

      uploadPanel.classList.add(
        "open"
      );

      uploadList.innerHTML = "";

      let successful = 0;

      for (const file of files) {

        const item =
          createUploadItem(file);

        uploadList.appendChild(
          item.element
        );

        try {

          await uploadFile(
            file,
            item
          );

          successful++;

        } catch (error) {

          console.error(error);

          item.status.textContent =
            "Upload failed";

          item.status.style.color =
            "#ef4444";

        }

      }


      await loadMedia();


      if (successful > 0) {

        showToast(
          `${successful} file${successful === 1 ? "" : "s"} uploaded successfully.`,
          "success"
        );

      }

    }


    /* =========================================================
       UPLOAD ITEM UI
    ========================================================= */

    function createUploadItem(file) {

      const element =
        document.createElement("div");

      element.className =
        "upload-item";


      const thumb =
        document.createElement("img");

      thumb.className =
        "upload-thumb";


      if (file.type.startsWith("image/")) {

        thumb.src =
          URL.createObjectURL(file);

      } else {

        thumb.src =
          createVideoPlaceholder();

      }


      const info =
        document.createElement("div");

      info.className =
        "upload-info";


      const name =
        document.createElement("div");

      name.className =
        "upload-name";

      name.textContent =
        file.name;


      const status =
        document.createElement("div");

      status.className =
        "upload-status";

      status.textContent =
        "Waiting...";


      const progress =
        document.createElement("div");

      progress.className =
        "progress";


      const progressBar =
        document.createElement("div");

      progressBar.className =
        "progress-bar";


      progress.appendChild(
        progressBar
      );


      info.appendChild(name);
      info.appendChild(status);
      info.appendChild(progress);


      const percent =
        document.createElement("div");

      percent.className =
        "upload-percent";

      percent.textContent =
        "0%";


      element.appendChild(thumb);
      element.appendChild(info);
      element.appendChild(percent);


      return {
        element,
        status,
        progressBar,
        percent
      };

    }


    /* =========================================================
       ACTUAL UPLOAD WITH PROGRESS
    ========================================================= */

    function uploadFile(
      file,
      ui
    ) {

      return new Promise(
        (resolve, reject) => {

          const xhr =
            new XMLHttpRequest();


          xhr.open(
            "POST",
            `${API}/upload`
          );


          xhr.upload.addEventListener(
            "progress",
            event => {

              if (!event.lengthComputable) {
                return;
              }

              const percent =
                Math.round(
                  (event.loaded /
                    event.total) *
                  100
                );


              ui.progressBar.style.width =
                `${percent}%`;

              ui.percent.textContent =
                `${percent}%`;

              ui.status.textContent =
                percent >= 100
                  ? "Processing..."
                  : "Uploading...";

            }
          );


          xhr.addEventListener(
            "load",
            () => {

              if (
                xhr.status >= 200 &&
                xhr.status < 300
              ) {

                ui.progressBar.style.width =
                  "100%";

                ui.percent.textContent =
                  "✓";

                ui.status.textContent =
                  "Uploaded";

                ui.status.style.color =
                  "#22c55e";

                resolve();

              } else {

                let message =
                  "Upload failed";

                try {

                  const data =
                    JSON.parse(
                      xhr.responseText
                    );

                  message =
                    data.error ||
                    message;

                } catch (_) {}


                reject(
                  new Error(message)
                );

              }

            }
          );


          xhr.addEventListener(
            "error",
            () => {
              reject(
                new Error(
                  "Network error"
                )
              );
            }
          );


          xhr.addEventListener(
            "abort",
            () => {
              reject(
                new Error(
                  "Upload cancelled"
                )
              );
            }
          );


          const formData =
            new FormData();

          formData.append(
            "file",
            file
          );


          xhr.send(formData);

        }
      );

    }


    /* =========================================================
       VIEWER
    ========================================================= */

    function openViewer(item) {

      currentViewerItem =
        item;

      viewerName.textContent =
        item.name;


      viewerContent.innerHTML =
        "";


      const isVideo =
        (item.type || "")
          .startsWith("video/");


      if (isVideo) {

        const video =
          document.createElement(
            "video"
          );

        video.src =
          item.url;

        video.controls =
          true;

        video.autoplay =
          true;

        video.playsInline =
          true;

        viewerContent.appendChild(
          video
        );

      } else {

        const img =
          document.createElement(
            "img"
          );

        img.src =
          item.url;

        img.alt =
          item.name;

        viewerContent.appendChild(
          img
        );

      }


      viewerModal.classList.add(
        "open"
      );

      document.body.style.overflow =
        "hidden";

    }


    /* =========================================================
       CLOSE VIEWER
    ========================================================= */

    function closeViewer() {

      viewerModal.classList.remove(
        "open"
      );

      viewerContent.innerHTML =
        "";

      currentViewerItem =
        null;

      document.body.style.overflow =
        "";

    }


    closeViewerBtn.addEventListener(
      "click",
      closeViewer
    );


    viewerModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          viewerModal
        ) {
          closeViewer();
        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          viewerModal.classList.contains(
            "open"
          )
        ) {
          closeViewer();
        }

      }
    );


    /* =========================================================
       DOWNLOAD
    ========================================================= */

    downloadBtn.addEventListener(
      "click",
      () => {

        if (!currentViewerItem) {
          return;
        }

        const url =
          `${currentViewerItem.url}?download=${encodeURIComponent(
            currentViewerItem.name
          )}`;


        const link =
          document.createElement("a");

        link.href =
          url;

        link.target =
          "_blank";

        link.rel =
          "noopener";

        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

      }
    );


    /* =========================================================
       DELETE FROM VIEWER
    ========================================================= */

    viewerDeleteBtn.addEventListener(
      "click",
      async () => {

        if (!currentViewerItem) {
          return;
        }

        await deleteMedia(
          currentViewerItem,
          true
        );

      }
    );


    /* =========================================================
       DELETE MEDIA
    ========================================================= */

    async function deleteMedia(
      item,
      fromViewer = false
    ) {

      const confirmed =
        confirm(
          `Delete "${item.name}"?`
        );

      if (!confirmed) {
        return;
      }


      try {

        const encodedKey =
          encodeURIComponent(
            item.key
          );


        const response =
          await fetch(
            `${API}/media/${encodedKey}`,
            {
              method: "DELETE"
            }
          );


        const data =
          await response.json();


        if (!response.ok ||
            !data.success) {

          throw new Error(
            data.error ||
            "Delete failed"
          );

        }


        media =
          media.filter(
            file =>
              file.key !== item.key
          );


        updateStats();

        renderGallery();


        if (fromViewer) {
          closeViewer();
        }


        showToast(
          "Media deleted.",
          "success"
        );

      } catch (error) {

        console.error(error);

        showToast(
          error.message ||
          "Could not delete file.",
          "error"
        );

      }

    }


    /* =========================================================
       REFRESH
    ========================================================= */

    refreshBtn.addEventListener(
      "click",
      async () => {

        refreshBtn.style.transform =
          "rotate(360deg)";

        await loadMedia();

        setTimeout(
          () => {
            refreshBtn.style.transform =
              "";
          },
          300
        );

      }
    );


    /* =========================================================
       UPLOAD PANEL CLOSE
    ========================================================= */

    closeUploadPanel.addEventListener(
      "click",
      () => {

        uploadPanel.classList.remove(
          "open"
        );

      }
    );


    /* =========================================================
       TOAST
    ========================================================= */

    function showToast(
      message,
      type = "success"
    ) {

      const toast =
        document.createElement(
          "div"
        );

      toast.className =
        `toast ${type}`;

      toast.textContent =
        message;


      toastContainer.appendChild(
        toast
      );


      setTimeout(
        () => {

          toast.style.opacity =
            "0";

          toast.style.transform =
            "translateX(15px)";

          setTimeout(
            () => toast.remove(),
            250
          );

        },
        3500
      );

    }


    /* =========================================================
       VIDEO PLACEHOLDER
    ========================================================= */

    function createVideoPlaceholder() {

      const canvas =
        document.createElement(
          "canvas"
        );

      canvas.width =
        100;

      canvas.height =
        100;


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.fillStyle =
        "#202329";

      ctx.fillRect(
        0,
        0,
        100,
        100
      );


      ctx.fillStyle =
        "#ffffff";

      ctx.font =
        "35px Arial";

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";

      ctx.fillText(
        "▶",
        50,
        50
      );


      return canvas.toDataURL();

    }


    /* =========================================================
       HTML ESCAPING
    ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeAttribute(
      value
    ) {

      return escapeHtml(
        value
      );

    }

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Muhammed Rashid KP | Contact</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    html {
      height: 100%;
    }

    body {
      /* Android Chrome shrinks 100vh when the address bar is showing,
         which used to leave a gap / cause jump on scroll. dvh fixes that,
         with vh as a fallback for older browsers. */
      min-height: 100vh;
      min-height: 100dvh;
      background: #05050a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      overflow-x: hidden;
      position: relative;
      width: 100%;
    }

    /* Moving Neon Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      animation: move 20s infinite alternate ease-in-out;
      z-index: 0;
      pointer-events: none;
      will-change: transform;
    }

    .orb1 {
      width: 380px;
      height: 380px;
      background: #ff00ff;
      top: -120px;
      left: -120px;
      animation-duration: 18s;
    }

    .orb2 {
      width: 320px;
      height: 320px;
      background: #00f0ff;
      bottom: -100px;
      right: -100px;
      animation-duration: 22s;
      animation-delay: -5s;
    }

    .orb3 {
      width: 280px;
      height: 280px;
      background: #9d00ff;
      top: 35%;
      left: 55%;
      animation-duration: 25s;
      animation-delay: -10s;
    }

    .orb4 {
      width: 240px;
      height: 240px;
      background: #00ff9d;
      bottom: 15%;
      left: 5%;
      animation-duration: 20s;
      animation-delay: -3s;
    }

    /* New orbs for extra motion */
    .orb5 {
      width: 200px;
      height: 200px;
      background: #ff2d75;
      top: 5%;
      right: 10%;
      animation: move2 16s infinite alternate ease-in-out;
      animation-delay: -7s;
    }

    .orb6 {
      width: 260px;
      height: 260px;
      background: #2d7bff;
      bottom: 40%;
      left: -80px;
      animation: move3 27s infinite alternate ease-in-out;
      animation-delay: -12s;
    }

    .orb7 {
      width: 160px;
      height: 160px;
      background: #ffee00;
      top: 60%;
      right: -60px;
      opacity: 0.4;
      animation: move2 19s infinite alternate ease-in-out;
      animation-delay: -2s;
    }

    .orb8 {
      width: 220px;
      height: 220px;
      background: #ff7a00;
      top: -60px;
      right: 30%;
      opacity: 0.35;
      animation: move3 23s infinite alternate ease-in-out;
      animation-delay: -9s;
    }

    @keyframes move {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
      50%  { transform: translate(60px, -50px) scale(1.1) rotate(15deg); }
      100% { transform: translate(-50px, 30px) scale(0.95) rotate(-10deg); }
    }

    @keyframes move2 {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
      33%  { transform: translate(-70px, 40px) scale(1.15) rotate(-20deg); }
      66%  { transform: translate(40px, 70px) scale(0.9) rotate(10deg); }
      100% { transform: translate(-30px, -60px) scale(1.05) rotate(20deg); }
    }

    @keyframes move3 {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(50px, 60px) scale(1.1); }
      50%  { transform: translate(90px, -30px) scale(0.9); }
      75%  { transform: translate(-40px, -50px) scale(1.15); }
      100% { transform: translate(-60px, 20px) scale(1); }
    }

    /* Subtle drifting starfield sparkle layer for extra depth */
    .sparkle-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.5), transparent),
        radial-gradient(2px 2px at 70% 20%, rgba(255,255,255,0.35), transparent),
        radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1.5px 1.5px at 85% 60%, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 10% 85%, rgba(255,255,255,0.35), transparent),
        radial-gradient(1.5px 1.5px at 60% 45%, rgba(255,255,255,0.25), transparent);
      background-size: 100% 100%;
      animation: sparkleDrift 30s linear infinite alternate;
      opacity: 0.6;
    }

    @keyframes sparkleDrift {
      0%   { background-position: 0% 0%; }
      100% { background-position: 5% 8%; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 10px 0;
    }

    .profile {
      margin-bottom: 28px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff00ff, #00f0ff, #9d00ff);
      background-size: 200% 200%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin: 0 auto 16px;
      box-shadow: 0 0 30px #ff00ff, 0 0 60px #00f0ff;
      animation: glow 4s infinite alternate, gradientShift 6s infinite;
    }

    @keyframes glow {
      0%   { box-shadow: 0 0 25px #ff00ff, 0 0 50px #00f0ff; }
      100% { box-shadow: 0 0 40px #ff00ff, 0 0 80px #00f0ff, 0 0 110px #9d00ff; }
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 1.75rem;
      background: linear-gradient(90deg, #ff00ff, #00f0ff, #9d00ff, #ff00ff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 5s linear infinite;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    @keyframes textShine {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .subtitle {
      color: #aaa;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }

    .link i {
      font-size: 1.25rem;
      width: 26px;
      text-align: center;
      flex-shrink: 0;
    }

    .link:hover, .link:active {
      transform: translateY(-4px) scale(1.02);
      border-color: #00f0ff;
      box-shadow: 0 0 22px #00f0ff55;
      background: rgba(0, 240, 255, 0.1);
    }

    .link.instagram:hover, .link.instagram:active { border-color: #ff00ff; box-shadow: 0 0 22px #ff00ff55; }
    .link.email:hover, .link.email:active         { border-color: #00ff9d; box-shadow: 0 0 22px #00ff9d55; }
    .link.phone:hover, .link.phone:active          { border-color: #ffaa00; box-shadow: 0 0 22px #ffaa0055; }
    .link.whatsapp:hover, .link.whatsapp:active     { border-color: #25d366; box-shadow: 0 0 22px #25d36655; }
    .link.github:hover, .link.github:active         { border-color: #ffffff; box-shadow: 0 0 22px #ffffff44; }

    footer {
      margin-top: 36px;
      font-size: 0.78rem;
      color: #555;
      position: relative;
      z-index: 1;
    }

    /* ========== PC / Large Screens ========== */
    @media (min-width: 768px) {
      body {
        padding: 40px 20px;
      }

      .container {
        max-width: 460px;
      }

      .avatar {
        width: 130px;
        height: 130px;
        font-size: 56px;
      }

      h1 {
        font-size: 2.1rem;
      }

      .subtitle {
        font-size: 1.05rem;
      }

      .link {
        padding: 17px 24px;
        font-size: 1rem;
      }

      .orb1, .orb2, .orb3, .orb4, .orb5, .orb6, .orb7, .orb8 {
        filter: blur(90px);
        opacity: 0.5;
      }
    }

    /* ========== Android / small phones (typical 360-412px widths) ========== */
    @media (max-width: 480px) {
      body {
        padding: 16px;
        padding-top: calc(16px + env(safe-area-inset-top));
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
        align-items: flex-start;
        padding-top: calc(32px + env(safe-area-inset-top));
      }

      .container {
        max-width: 100%;
        margin: auto 0;
      }

      /* Shrink & pull in orbs so they don't force horizontal scroll
         on narrow Android viewports */
      .orb {
        filter: blur(60px);
      }

      .orb1 { width: 220px; height: 220px; top: -80px; left: -80px; }
      .orb2 { width: 200px; height: 200px; bottom: -70px; right: -70px; }
      .orb3 { width: 170px; height: 170px; top: 30%; left: 60%; }
      .orb4 { width: 150px; height: 150px; bottom: 10%; left: -20px; }
      .orb5 { width: 130px; height: 130px; top: 3%; right: 2%; }
      .orb6 { width: 160px; height: 160px; bottom: 35%; left: -60px; }
      .orb7 { width: 110px; height: 110px; top: 55%; right: -40px; }
      .orb8 { width: 140px; height: 140px; top: -40px; right: 15%; }
    }

    /* ========== Very Small Phones ========== */
    @media (max-width: 360px) {
      .container {
        max-width: 100%;
      }

      h1 {
        font-size: 1.5rem;
      }

      .avatar {
        width: 95px;
        height: 95px;
        font-size: 42px;
      }

      .link {
        padding: 13px 16px;
        font-size: 0.9rem;
      }
    }

    /* Respect users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .orb, .avatar, h1, .sparkle-layer {
        animation: none !important;
      }
    }
  </style>
</head>

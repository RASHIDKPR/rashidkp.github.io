<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  AI Image Generator
</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;

  font-family:
    "Segoe UI",
    system-ui,
    sans-serif;
}


/* =====================================================
   BODY
===================================================== */

body {

  min-height: 100vh;

  color: white;

  background:
    linear-gradient(
      135deg,
      #0f0c29,
      #302b63,
      #24243e
    );

  display: flex;

  flex-direction: column;

  align-items: center;

  padding: 40px 20px;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {

  width: 100%;

  max-width: 850px;
}


/* =====================================================
   HEADER
===================================================== */

h1 {

  text-align: center;

  font-size: 3rem;

  margin-bottom: 10px;

  background:
    linear-gradient(
      90deg,
      #00d2ff,
      #3a7bd5
    );

  -webkit-background-clip: text;

  -webkit-text-fill-color: transparent;
}


.subtitle {

  text-align: center;

  color: #a5a5a5;

  margin-bottom: 40px;

  font-size: 16px;
}


/* =====================================================
   MAIN CARD
===================================================== */

.card {

  padding: 30px;

  border-radius: 22px;

  background:
    rgba(255,255,255,0.08);

  border:
    1px solid
    rgba(255,255,255,0.1);

  backdrop-filter:
    blur(15px);

  box-shadow:
    0 25px 60px
    rgba(0,0,0,0.35);
}


/* =====================================================
   TEXTAREA
===================================================== */

textarea {

  width: 100%;

  min-height: 130px;

  padding: 18px;

  border-radius: 14px;

  border:
    1px solid
    rgba(255,255,255,0.15);

  outline: none;

  resize: vertical;

  color: white;

  background:
    rgba(0,0,0,0.3);

  font-size: 16px;

  line-height: 1.5;

  transition:
    border 0.2s;
}


textarea::placeholder {

  color: #888;
}


textarea:focus {

  border-color:
    #00d2ff;
}


/* =====================================================
   GENERATE BUTTON
===================================================== */

.generate-btn {

  width: 100%;

  margin-top: 20px;

  padding: 16px;

  border: none;

  border-radius: 13px;

  color: white;

  font-size: 18px;

  font-weight: 700;

  cursor: pointer;

  background:
    linear-gradient(
      90deg,
      #00d2ff,
      #3a7bd5
    );

  transition:
    transform 0.2s,
    opacity 0.2s;
}


.generate-btn:hover {

  transform:
    translateY(-2px);
}


.generate-btn:disabled {

  opacity: 0.6;

  cursor:
    not-allowed;

  transform: none;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

  display: none;

  text-align: center;

  margin-top: 30px;

  color:
    #00d2ff;
}


.spinner {

  width: 42px;

  height: 42px;

  margin:
    0 auto 15px;

  border-radius: 50%;

  border:
    4px solid
    rgba(255,255,255,0.12);

  border-top-color:
    #00d2ff;

  animation:
    spin 0.8s linear infinite;
}


@keyframes spin {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}


/* =====================================================
   ERROR
===================================================== */

.error {

  display: none;

  margin-top: 20px;

  padding: 12px;

  border-radius: 10px;

  text-align: center;

  color:
    #ff7676;

  background:
    rgba(255,0,0,0.08);
}


/* =====================================================
   RESULT
===================================================== */

.result {

  display: none;

  margin-top: 40px;
}


.result-card {

  padding: 20px;

  border-radius: 22px;

  background:
    rgba(255,255,255,0.08);

  border:
    1px solid
    rgba(255,255,255,0.1);

  backdrop-filter:
    blur(15px);

  box-shadow:
    0 25px 60px
    rgba(0,0,0,0.35);
}


.result-title {

  text-align: center;

  font-size: 21px;

  font-weight: 700;

  margin-bottom: 20px;
}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

.image-container {

  position: relative;

  overflow: hidden;

  width: 100%;

  border-radius: 17px;

  background:
    #080808;

  cursor: pointer;
}


.image-container img {

  display: block;

  width: 100%;

  max-height: 700px;

  object-fit: contain;

  transition:
    transform 0.3s;
}


.image-container:hover img {

  transform:
    scale(1.02);
}


/* =====================================================
   IMAGE OVERLAY
===================================================== */

.image-overlay {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    rgba(0,0,0,0.35);

  opacity: 0;

  transition:
    opacity 0.25s;
}


.image-container:hover
.image-overlay {

  opacity: 1;
}


.view-full {

  padding:
    13px 22px;

  border-radius:
    30px;

  border:
    1px solid
    rgba(255,255,255,0.3);

  color: white;

  background:
    rgba(0,0,0,0.7);

  backdrop-filter:
    blur(10px);

  font-weight: 600;

  cursor: pointer;
}


/* =====================================================
   ACTIONS
===================================================== */

.actions {

  display: flex;

  gap: 12px;

  margin-top: 18px;
}


.action {

  flex: 1;

  padding: 14px;

  border: none;

  border-radius: 12px;

  color: white;

  font-size: 15px;

  font-weight: 600;

  cursor: pointer;

  transition:
    transform 0.2s;
}


.action:hover {

  transform:
    translateY(-2px);
}


.preview-action {

  background:
    rgba(255,255,255,0.12);

  border:
    1px solid
    rgba(255,255,255,0.15);
}


.download-action {

  background:
    linear-gradient(
      90deg,
      #00d2ff,
      #3a7bd5
    );
}


/* =====================================================
   FULLSCREEN PREVIEW MODAL
===================================================== */

.modal {

  position: fixed;

  inset: 0;

  z-index: 9999;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 25px;

  background:
    rgba(0,0,0,0.93);

  backdrop-filter:
    blur(15px);
}


.modal.active {

  display: flex;
}


/* =====================================================
   MODAL IMAGE
===================================================== */

.modal-image {

  max-width: 95vw;

  max-height: 88vh;

  object-fit: contain;

  border-radius: 12px;

  box-shadow:
    0 20px 80px
    rgba(0,0,0,0.7);
}


/* =====================================================
   CLOSE
===================================================== */

.close {

  position: fixed;

  top: 20px;

  right: 25px;

  width: 48px;

  height: 48px;

  border-radius: 50%;

  border:
    1px solid
    rgba(255,255,255,0.2);

  color: white;

  background:
    rgba(255,255,255,0.1);

  font-size: 30px;

  cursor: pointer;

  z-index: 10001;
}


.close:hover {

  background:
    rgba(255,255,255,0.2);
}


/* =====================================================
   MODAL DOWNLOAD
===================================================== */

.modal-download {

  position: fixed;

  bottom: 25px;

  left: 50%;

  transform:
    translateX(-50%);

  padding:
    13px 25px;

  border: none;

  border-radius: 30px;

  color: white;

  background:
    linear-gradient(
      90deg,
      #00d2ff,
      #3a7bd5
    );

  font-weight: 600;

  cursor: pointer;
}


/* =====================================================
   FOOTER
===================================================== */

footer {

  margin-top: 50px;

  color: #666;

  text-align: center;

  font-size: 14px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  body {

    padding:
      25px 15px;
  }


  h1 {

    font-size:
      2.2rem;
  }


  .subtitle {

    font-size:
      14px;

    margin-bottom:
      25px;
  }


  .card {

    padding:
      20px;
  }


  .actions {

    flex-direction:
      column;
  }


  .modal {

    padding:
      10px;
  }


  .modal-image {

    max-width:
      100vw;

    max-height:
      84vh;
  }

}

</style>

</head>


<body>


<div class="container">


  <!-- =================================================
       HEADER
  ================================================= -->

  <h1>
    AI Image Generator
  </h1>


  <p class="subtitle">
    Create stunning images from text using Cloudflare Workers AI
  </p>


  <!-- =================================================
       INPUT CARD
  ================================================= -->

  <div class="card">


    <textarea
      id="prompt"
      placeholder="Describe the image you want to create...

Example:
A futuristic city at sunset, cyberpunk style, cinematic lighting, highly detailed"
    ></textarea>


    <button
      class="generate-btn"
      id="generateBtn"
      onclick="generateImage()"
    >
      Generate Image
    </button>


    <!-- LOADING -->

    <div
      class="loading"
      id="loading"
    >

      <div class="spinner"></div>

      <div>
        Generating your image...
      </div>

      <small>
        Please wait
      </small>

    </div>


    <!-- ERROR -->

    <div
      class="error"
      id="error"
    ></div>


  </div>


  <!-- =================================================
       RESULT
  ================================================= -->

  <div
    class="result"
    id="result"
  >


    <div class="result-card">


      <div class="result-title">

        ✨ Created Image

      </div>


      <!-- IMAGE -->

      <div
        class="image-container"
        onclick="openPreview()"
      >

        <img
          id="generatedImage"
          alt="Generated AI Image"
        >


        <div class="image-overlay">

          <button
            class="view-full"
            onclick="
              event.stopPropagation();
              openPreview();
            "
          >
            🔍 View Full Preview
          </button>

        </div>

      </div>


      <!-- BUTTONS -->

      <div class="actions">


        <button
          class="action preview-action"
          onclick="openPreview()"
        >
          🔍 Preview
        </button>


        <button
          class="action download-action"
          onclick="downloadImage()"
        >
          💾 Download
        </button>


      </div>


    </div>


  </div>


</div>


<!-- =================================================
     FULLSCREEN PREVIEW
================================================= -->

<div
  class="modal"
  id="previewModal"
  onclick="closePreview()"
>


  <!-- CLOSE -->

  <button
    class="close"
    onclick="
      event.stopPropagation();
      closePreview();
    "
  >
    ×
  </button>


  <!-- IMAGE -->

  <img
    class="modal-image"
    id="modalImage"
    alt="Full Image Preview"
    onclick="event.stopPropagation()"
  >


  <!-- DOWNLOAD -->

  <button
    class="modal-download"
    onclick="
      event.stopPropagation();
      downloadImage();
    "
  >
    💾 Download Image
  </button>


</div>


<!-- =================================================
     FOOTER
================================================= -->

<footer>

  Powered by Cloudflare Workers AI
  •
  Made by Muhammed Rashid KP

</footer>


<script>


// =====================================================
// API
// =====================================================

const API_URL =
  "https://image-api.itsmerashidkp.workers.dev";


// =====================================================
// IMAGE URL
// =====================================================

let currentImageUrl = null;


// =====================================================
// GENERATE IMAGE
// =====================================================

async function generateImage() {


  const prompt =
    document
      .getElementById("prompt")
      .value
      .trim();


  const button =
    document
      .getElementById("generateBtn");


  const loading =
    document
      .getElementById("loading");


  const result =
    document
      .getElementById("result");


  const error =
    document
      .getElementById("error");


  const image =
    document
      .getElementById("generatedImage");


  const modalImage =
    document
      .getElementById("modalImage");


  // -----------------------------------------------
  // VALIDATE
  // -----------------------------------------------

  if (!prompt) {

    alert(
      "Please enter a prompt!"
    );

    return;
  }


  // -----------------------------------------------
  // RESET UI
  // -----------------------------------------------

  button.disabled =
    true;

  button.textContent =
    "Generating...";


  loading.style.display =
    "block";


  result.style.display =
    "none";


  error.style.display =
    "none";


  error.textContent =
    "";


  // -----------------------------------------------
  // REMOVE OLD IMAGE URL
  // -----------------------------------------------

  if (currentImageUrl) {

    URL.revokeObjectURL(
      currentImageUrl
    );

    currentImageUrl =
      null;
  }


  try {


    // =============================================
    // API REQUEST
    // =============================================

    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({
              prompt:
                prompt
            })

        }
      );


    // =============================================
    // SERVER ERROR
    // =============================================

    if (!response.ok) {


      let message =
        "Server error";


      try {

        const data =
          await response.json();


        message =
          data.error ||
          message;

      }

      catch {

        const text =
          await response.text();


        if (text) {

          message =
            text;
        }
      }


      throw new Error(
        `${response.status}: ${message}`
      );
    }


    // =============================================
    // CONTENT TYPE
    // =============================================

    const contentType =
      response.headers
        .get("content-type");


    if (
      !contentType ||
      !contentType.startsWith("image/")
    ) {

      throw new Error(
        "The API did not return an image."
      );
    }


    // =============================================
    // GET IMAGE
    // =============================================

    const blob =
      await response.blob();


    // =============================================
    // CREATE LOCAL URL
    // =============================================

    currentImageUrl =
      URL.createObjectURL(
        blob
      );


    // =============================================
    // SET IMAGE
    // =============================================

    image.src =
      currentImageUrl;


    modalImage.src =
      currentImageUrl;


    // =============================================
    // SHOW RESULT
    // =============================================

    result.style.display =
      "block";


    // =============================================
    // SCROLL TO IMAGE
    // =============================================

    setTimeout(() => {

      result.scrollIntoView({
        behavior:
          "smooth",

        block:
          "start"
      });

    }, 100);


  }

  catch (err) {


    console.error(
      "Generation error:",
      err
    );


    error.textContent =
      "❌ " +
      err.message;


    error.style.display =
      "block";


  }

  finally {


    button.disabled =
      false;


    button.textContent =
      "Generate Image";


    loading.style.display =
      "none";

  }

}


// =====================================================
// OPEN PREVIEW
// =====================================================

function openPreview() {


  if (!currentImageUrl) {

    return;
  }


  const modal =
    document
      .getElementById(
        "previewModal"
      );


  const modalImage =
    document
      .getElementById(
        "modalImage"
      );


  modalImage.src =
    currentImageUrl;


  modal.classList.add(
    "active"
  );


  document.body.style.overflow =
    "hidden";

}


// =====================================================
// CLOSE PREVIEW
// =====================================================

function closePreview() {


  const modal =
    document
      .getElementById(
        "previewModal"
      );


  modal.classList.remove(
    "active"
  );


  document.body.style.overflow =
    "";

}


// =====================================================
// ESC KEY
// =====================================================

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closePreview();
    }

  }
);


// =====================================================
// DOWNLOAD
// =====================================================

function downloadImage() {


  if (!currentImageUrl) {

    alert(
      "No image available."
    );

    return;
  }


  const link =
    document.createElement(
      "a"
    );


  link.href =
    currentImageUrl;


  link.download =
    "ai-generated-image.png";


  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );

}


// =====================================================
// CTRL + ENTER
// =====================================================

document
  .getElementById("prompt")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.ctrlKey &&
        event.key === "Enter"
      ) {

        generateImage();

      }

    }
  );

</script>


</body>

</html>

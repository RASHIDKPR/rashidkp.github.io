<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Image Editor</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 10% 10%,
          #243b55,
          transparent 40%
        ),

        radial-gradient(
          circle at 90% 90%,
          #141e30,
          #05070b
        );

      padding: 30px 15px;
    }


    .container {

      width: 100%;

      max-width: 950px;

      margin: auto;
    }


    h1 {

      text-align: center;

      font-size: 38px;

      margin-bottom: 10px;
    }


    .subtitle {

      text-align: center;

      color: #aaa;

      margin-bottom: 30px;
    }


    .card {

      background:
        rgba(
          255,
          255,
          255,
          0.07
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.12
        );

      border-radius: 22px;

      padding: 25px;

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);
    }


    /* ==========================
       UPLOAD
    ========================== */

    .upload-box {

      display: block;

      border:
        2px dashed
        #555;

      border-radius: 18px;

      padding: 35px 20px;

      text-align: center;

      cursor: pointer;

      transition: 0.2s;
    }


    .upload-box:hover {

      border-color:
        #8b5cf6;

      background:
        rgba(
          139,
          92,
          246,
          0.08
        );
    }


    .upload-icon {

      font-size: 45px;

      margin-bottom: 10px;
    }


    .upload-text {

      color: #aaa;

      margin-top: 8px;

      font-size: 14px;
    }


    #imageInput {

      display: none;
    }


    /* ==========================
       IMAGE GRID
    ========================== */

    .image-grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          1fr
        );

      gap: 12px;

      margin-top: 20px;
    }


    .image-card {

      position: relative;

      overflow: hidden;

      border-radius: 14px;

      background: #111;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.12
        );
    }


    .image-card img {

      display: block;

      width: 100%;

      aspect-ratio: 1 / 1;

      object-fit: cover;
    }


    .image-number {

      position: absolute;

      top: 7px;

      left: 7px;

      padding:
        5px 8px;

      border-radius: 8px;

      background:
        rgba(
          0,
          0,
          0,
          0.7
        );

      font-size: 12px;

      font-weight: bold;
    }


    .remove-image {

      position: absolute;

      top: 7px;

      right: 7px;

      width: 28px;

      height: 28px;

      border: none;

      border-radius: 50%;

      background:
        rgba(
          255,
          50,
          50,
          0.9
        );

      color: white;

      cursor: pointer;

      font-size: 16px;

      font-weight: bold;
    }


    .image-name {

      padding:
        7px;

      font-size: 10px;

      color: #aaa;

      text-align: center;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .image-count {

      margin-top: 12px;

      color: #888;

      font-size: 13px;

      text-align: center;
    }


    /* ==========================
       PROMPT
    ========================== */

    textarea {

      width: 100%;

      min-height: 150px;

      resize: vertical;

      margin-top: 25px;

      padding: 18px;

      border-radius: 15px;

      border:
        1px solid
        #444;

      background:
        rgba(
          0,
          0,
          0,
          0.35
        );

      color: white;

      font-size: 16px;

      line-height: 1.5;

      outline: none;
    }


    textarea:focus {

      border-color:
        #8b5cf6;
    }


    textarea::placeholder {

      color: #777;
    }


    /* ==========================
       GENERATE BUTTON
    ========================== */

    .generate-btn {

      width: 100%;

      margin-top: 18px;

      padding: 16px;

      border: none;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #4f46e5
        );

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }


    .generate-btn:hover {

      opacity: 0.9;

      transform:
        translateY(-1px);
    }


    .generate-btn:disabled {

      opacity: 0.5;

      cursor: not-allowed;

      transform: none;
    }


    /* ==========================
       LOADING
    ========================== */

    .loading {

      display: none;

      text-align: center;

      margin-top: 25px;
    }


    .spinner {

      width: 40px;

      height: 40px;

      border:
        4px solid
        #444;

      border-top-color:
        #8b5cf6;

      border-radius: 50%;

      animation:
        spin 1s linear infinite;

      margin: auto;
    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);
      }
    }


    /* ==========================
       ERROR
    ========================== */

    .error {

      display: none;

      margin-top: 20px;

      padding: 14px;

      border-radius: 12px;

      background:
        rgba(
          255,
          0,
          0,
          0.15
        );

      border:
        1px solid
        rgba(
          255,
          0,
          0,
          0.3
        );

      color: #ff8a8a;

      line-height: 1.5;
    }


    /* ==========================
       RESULT
    ========================== */

    .result {

      display: none;

      margin-top: 30px;
    }


    .result h2 {

      margin-bottom: 15px;
    }


    .result img {

      display: block;

      width: 100%;

      max-height: 750px;

      object-fit: contain;

      border-radius: 18px;

      cursor: pointer;

      background: #111;
    }


    /* ==========================
       DOWNLOAD
    ========================== */

    .download-btn {

      display: block;

      text-align: center;

      text-decoration: none;

      margin-top: 15px;

      padding: 14px;

      border-radius: 13px;

      background:
        #16a34a;

      color: white;

      font-weight: bold;
    }


    /* ==========================
       HINT
    ========================== */

    .hint {

      margin-top: 15px;

      color: #777;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;
    }


    /* ==========================
       MODAL
    ========================== */

    .modal {

      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(
          0,
          0,
          0,
          0.92
        );

      z-index: 9999;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }


    .modal img {

      max-width: 95%;

      max-height: 95%;

      object-fit: contain;
    }


    .close {

      position: absolute;

      top: 15px;

      right: 25px;

      font-size: 45px;

      cursor: pointer;

      color: white;
    }


    /* ==========================
       MOBILE
    ========================== */

    @media (
      max-width: 700px
    ) {

      body {

        padding:
          15px 10px;
      }


      h1 {

        font-size: 28px;
      }


      .card {

        padding: 18px;
      }


      .image-grid {

        grid-template-columns:
          repeat(
            2,
            1fr
          );
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    ✨ AI Image Editor
  </h1>


  <p class="subtitle">
    Add up to 4 reference images and tell AI what to create.
  </p>


  <div class="card">


    <!-- ==========================
         UPLOAD
    ========================== -->

    <label
      class="upload-box"
      for="imageInput"
    >

      <div class="upload-icon">
        📷
      </div>


      <div>
        Click to upload images
      </div>


      <div class="upload-text">

        Select up to 4 JPG,
        PNG or WEBP images

      </div>

    </label>


    <input
      type="file"
      id="imageInput"
      accept="image/png,image/jpeg,image/webp"
      multiple
    >


    <!-- ==========================
         IMAGE GRID
    ========================== -->

    <div
      class="image-grid"
      id="imageGrid"
    ></div>


    <div
      class="image-count"
      id="imageCount"
    >
      0 / 4 images
    </div>


    <!-- ==========================
         PROMPT
    ========================== -->

    <textarea
      id="prompt"
      placeholder="Tell AI what to create...

Example:

Take the person from image 1 and place them beside the person from image 2. Keep both people realistic. Match the lighting, shadows, perspective and camera quality of the original image.

You can reference images as:
image 1
image 2
image 3
image 4"
    ></textarea>


    <!-- ==========================
         GENERATE
    ========================== -->

    <button
      class="generate-btn"
      id="generateBtn"
    >

      ✨ Generate / Edit Image

    </button>


    <!-- ==========================
         LOADING
    ========================== -->

    <div
      class="loading"
      id="loading"
    >

      <div class="spinner"></div>


      <p
        style="
          margin-top:12px;
          color:#aaa;
        "
      >

        AI is creating your image...

      </p>

    </div>


    <!-- ==========================
         ERROR
    ========================== -->

    <div
      class="error"
      id="error"
    ></div>


    <!-- ==========================
         RESULT
    ========================== -->

    <div
      class="result"
      id="result"
    >

      <h2>
        ✨ Result
      </h2>


      <img
        id="resultImage"
        alt="AI generated image"
      >


      <a
        id="downloadBtn"
        class="download-btn"
        download="ai-edited-image.png"
      >

        ⬇️ Download Image

      </a>


      <p class="hint">

        Click the generated image
        to view fullscreen.

      </p>

    </div>


  </div>

</div>


<!-- ==========================
     FULLSCREEN MODAL
========================== -->

<div
  class="modal"
  id="modal"
>

  <div
    class="close"
    id="closeModal"
  >

    ×

  </div>


  <img
    id="modalImage"
    alt="Fullscreen result"
  >

</div>


<script>


// ======================================================
// CLOUDFLARE WORKER
// ======================================================

const API_URL =
  "https://image-api.itsmerashidkp.workers.dev";


// ======================================================
// ELEMENTS
// ======================================================

const imageInput =
  document.getElementById(
    "imageInput"
  );


const imageGrid =
  document.getElementById(
    "imageGrid"
  );


const imageCount =
  document.getElementById(
    "imageCount"
  );


const promptInput =
  document.getElementById(
    "prompt"
  );


const generateBtn =
  document.getElementById(
    "generateBtn"
  );


const loading =
  document.getElementById(
    "loading"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const result =
  document.getElementById(
    "result"
  );


const resultImage =
  document.getElementById(
    "resultImage"
  );


const downloadBtn =
  document.getElementById(
    "downloadBtn"
  );


const modal =
  document.getElementById(
    "modal"
  );


const modalImage =
  document.getElementById(
    "modalImage"
  );


const closeModal =
  document.getElementById(
    "closeModal"
  );


// ======================================================
// STATE
// ======================================================

let selectedFiles = [];

let resultURL = null;


// ======================================================
// IMAGE SELECT
// ======================================================

imageInput.addEventListener(
  "change",
  () => {

    const files =
      Array.from(
        imageInput.files
      );


    addImages(files);


    // Allows selecting the same
    // file again later

    imageInput.value = "";

  }
);


// ======================================================
// ADD IMAGES
// ======================================================

function addImages(files) {

  for (
    const file of files
  ) {

    // Maximum 4

    if (
      selectedFiles.length >= 4
    ) {

      showError(
        "Maximum 4 images allowed."
      );

      break;
    }


    // Check image

    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      showError(
        `${file.name} is not a valid image.`
      );

      continue;
    }


    selectedFiles.push(
      file
    );

  }


  renderImages();

}


// ======================================================
// RENDER IMAGE GRID
// ======================================================

function renderImages() {

  imageGrid.innerHTML = "";


  selectedFiles.forEach(
    (file, index) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "image-card";


      const img =
        document.createElement(
          "img"
        );


      const reader =
        new FileReader();


      reader.onload = () => {

        img.src =
          reader.result;

      };


      reader.readAsDataURL(
        file
      );


      // Image number

      const number =
        document.createElement(
          "div"
        );


      number.className =
        "image-number";


      number.textContent =
        `Image ${index + 1}`;


      // Remove

      const remove =
        document.createElement(
          "button"
        );


      remove.className =
        "remove-image";


      remove.textContent =
        "×";


      remove.title =
        "Remove image";


      remove.addEventListener(
        "click",
        () => {

          selectedFiles.splice(
            index,
            1
          );


          renderImages();

        }
      );


      // Filename

      const name =
        document.createElement(
          "div"
        );


      name.className =
        "image-name";


      name.textContent =
        file.name;


      card.appendChild(
        img
      );


      card.appendChild(
        number
      );


      card.appendChild(
        remove
      );


      card.appendChild(
        name
      );


      imageGrid.appendChild(
        card
      );

    }
  );


  imageCount.textContent =
    `${selectedFiles.length} / 4 images`;

}


// ======================================================
// RESIZE IMAGE
// ======================================================

function resizeImage(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        const img =
          new Image();


        img.onload = () => {

          // Must be BELOW 512 x 512

          const maxSize =
            511;


          let width =
            img.naturalWidth;


          let height =
            img.naturalHeight;


          if (
            !width ||
            !height
          ) {

            reject(
              new Error(
                "Could not read image dimensions."
              )
            );

            return;
          }


          // Keep aspect ratio

          if (
            width > maxSize ||
            height > maxSize
          ) {

            const scale =
              Math.min(
                maxSize / width,
                maxSize / height
              );


            width =
              Math.max(
                1,
                Math.round(
                  width * scale
                )
              );


            height =
              Math.max(
                1,
                Math.round(
                  height * scale
                )
              );

          }


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;


          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          if (!ctx) {

            reject(
              new Error(
                "Could not create canvas."
              )
            );

            return;
          }


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          canvas.toBlob(
            (blob) => {

              if (!blob) {

                reject(
                  new Error(
                    "Could not convert image."
                  )
                );

                return;
              }


              resolve(
                blob
              );

            },
            "image/jpeg",
            0.90
          );

        };


        img.onerror = () => {

          reject(
            new Error(
              `Invalid image: ${file.name}`
            )
          );

        };


        img.src =
          reader.result;

      };


      reader.onerror = () => {

        reject(
          new Error(
            `Could not read ${file.name}`
          )
        );

      };


      reader.readAsDataURL(
        file
      );

    }
  );

}


// ======================================================
// GENERATE
// ======================================================

generateBtn.addEventListener(
  "click",
  async () => {

    hideError();


    result.style.display =
      "none";


    // Check images

    if (
      selectedFiles.length === 0
    ) {

      showError(
        "Please select at least one image."
      );

      return;
    }


    // Check prompt

    const prompt =
      promptInput.value.trim();


    if (!prompt) {

      showError(
        "Please enter a prompt."
      );

      return;
    }


    // Loading

    generateBtn.disabled =
      true;


    loading.style.display =
      "block";


    try {


      // ===============================================
      // CREATE FORM DATA
      // ===============================================

      const formData =
        new FormData();


      // Prompt

      formData.append(
        "prompt",
        prompt
      );


      // ===============================================
      // RESIZE + ADD ALL IMAGES
      // ===============================================

      for (
        let i = 0;
        i < selectedFiles.length;
        i++
      ) {

        const file =
          selectedFiles[i];


        console.log(
          `Resizing image ${i + 1}...`
        );


        const resized =
          await resizeImage(
            file
          );


        console.log(
          `Image ${i + 1}:`,
          resized.size,
          "bytes"
        );


        /*
          IMPORTANT:

          Every image is sent
          with the same "image"
          field.

          Worker converts them to:

          input_image_0
          input_image_1
          input_image_2
          input_image_3
        */

        formData.append(
          "image",
          resized,
          `image_${i + 1}.jpg`
        );

      }


      // ===============================================
      // SEND TO CLOUDFLARE
      // ===============================================

      console.log(
        "Sending",
        selectedFiles.length,
        "reference images..."
      );


      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            body: formData
          }
        );


      // ===============================================
      // ERROR
      // ===============================================

      if (
        !response.ok
      ) {

        let message =
          "Image generation failed.";


        try {

          const data =
            await response.json();


          if (data.error) {

            message =
              data.error;

          }

        } catch (_) {}


        throw new Error(
          message
        );

      }


      // ===============================================
      // IMAGE RESULT
      // ===============================================

      const blob =
        await response.blob();


      console.log(
        "Result:",
        blob.type,
        blob.size
      );


      if (
        !blob.type.startsWith(
          "image/"
        )
      ) {

        throw new Error(
          "Server did not return an image."
        );

      }


      // ===============================================
      // DISPLAY
      // ===============================================

      if (resultURL) {

        URL.revokeObjectURL(
          resultURL
        );

      }


      resultURL =
        URL.createObjectURL(
          blob
        );


      resultImage.src =
        resultURL;


      downloadBtn.href =
        resultURL;


      result.style.display =
        "block";


      // Scroll

      setTimeout(
        () => {

          result.scrollIntoView({
            behavior:
              "smooth",

            block:
              "start"
          });

        },
        100
      );


    } catch (error) {

      console.error(
        error
      );


      showError(
        error.message ||
        "Something went wrong."
      );


    } finally {

      generateBtn.disabled =
        false;


      loading.style.display =
        "none";

    }

  }
);


// ======================================================
// ERROR
// ======================================================

function showError(
  message
) {

  errorBox.textContent =
    "❌ " + message;


  errorBox.style.display =
    "block";

}


function hideError() {

  errorBox.style.display =
    "none";


  errorBox.textContent =
    "";

}


// ======================================================
// FULLSCREEN
// ======================================================

resultImage.addEventListener(
  "click",
  () => {

    if (
      !resultImage.src
    ) {
      return;
    }


    modalImage.src =
      resultImage.src;


    modal.style.display =
      "flex";

  }
);


// ======================================================
// CLOSE MODAL
// ======================================================

closeModal.addEventListener(
  "click",
  () => {

    modal.style.display =
      "none";

  }
);


modal.addEventListener(
  "click",
  (event) => {

    if (
      event.target ===
      modal
    ) {

      modal.style.display =
        "none";

    }

  }
);


// ======================================================
// ESC
// ======================================================

document.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key ===
      "Escape"
    ) {

      modal.style.display =
        "none";

    }

  }
);


// ======================================================
// CTRL + ENTER
// ======================================================

promptInput.addEventListener(
  "keydown",
  (event) => {

    if (
      event.ctrlKey &&
      event.key === "Enter"
    ) {

      generateBtn.click();

    }

  }
);

</script>

</body>

</html>
